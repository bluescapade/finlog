<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Log</title>
<meta name="theme-color" content="#FBF1E6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Gaegu:wght@700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--fn:#F2E2D1;
  --bg:#FBF1E6;--card:#FFFDF8;--ink:#5C3D2E;--soft:#8F6E5C;--line:#E3CDB8;--cream:#FFF6EA;
  --butter:#F7D774;--butter2:#FBE7A6;--pink:#F6B8C8;--pink2:#FDE3EA;--mint2:#DDF2E4;--blue2:#E1EFF7;--lav2:#ECE4FA;--peach2:#FDE6D6;
  --neg:#C2476A;--good:#3E8A5E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.fr{font-family:'Fredoka',system-ui,sans-serif;font-weight:600}
.cute{font-family:'Gaegu',cursive;font-weight:700}
#app{max-width:460px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sb{justify-content:space-between}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--good)}.negc{color:var(--neg)}
.hidden{display:none!important}

/* ---- animations ---- */
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes dropIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sinkOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(22px) scale(.9)}}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-7px) rotate(-1deg)}75%{transform:translateX(7px) rotate(1deg)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.enter{animation:popIn .32s cubic-bezier(.2,.9,.3,1.25) backwards}
.swap>*{animation:popIn .32s cubic-bezier(.2,.9,.3,1.2) backwards}
.swap>*:nth-child(2){animation-delay:.03s}.swap>*:nth-child(3){animation-delay:.06s}.swap>*:nth-child(4){animation-delay:.09s}.swap>*:nth-child(5){animation-delay:.12s}.swap>*:nth-child(n+6){animation-delay:.15s}
.swap>.top{animation:none}
.leaving{height:0!important;opacity:0;transform:scale(.95);padding-top:0!important;padding-bottom:0!important;border-width:0!important;margin-top:-16px;overflow:hidden;transition:height .22s ease,opacity .18s ease,transform .2s ease,padding .22s ease,margin .22s ease}
.leaving.tight{margin-top:0}
.bob{animation:bob 3.2s ease-in-out infinite}
.shake{animation:shake .38s ease}
@media (prefers-reduced-motion:reduce){.enter,.swap>*,.bob{animation:none}.leaving{transition:none}}

/* press animation */
.btn,.ibtn,.pill,.arrow,.card,.day,.swbtn,.xbtn,.tog,.chk,.mbox,.qchip,.seg button,.backbtn,.sortbtn,.navi,.pigbtn,.wrow,.key{transition:transform .09s ease,box-shadow .09s ease}
.btn:not(:disabled):active,.ibtn:active,.pill:active,.arrow:not(:disabled):active,.tog:active,.chk:active,.mbox:not(:disabled):active,.qchip:active,.seg button:active,.backbtn:active,.sortbtn:active,.key:not(.ghost):active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.card:active{transform:translateY(2px) scale(.995);box-shadow:0 1px 0 var(--line)}
.card.tap:active{transform:translateY(3px) scale(.985)}
.day:not(:disabled):active,.swbtn:active,.xbtn:active,.pigbtn:active{transform:scale(.9)}
.navi:active,.wrow:active{transform:scale(.97)}

/* top bar */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:8px 0;background:linear-gradient(var(--bg) 78%,rgba(251,241,230,0))}
.ibtn{width:48px;height:48px;border-radius:16px;border:2.5px solid var(--ink);background:var(--fn);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 0 var(--ink);flex:none}
.ibtn.on{background:var(--butter)}
.pill{flex:1;min-width:0;height:48px;border-radius:999px;border:2.5px solid var(--ink);background:var(--fn);box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;padding:0 12px;white-space:nowrap}
.pill svg{transition:transform .2s;flex:none}
.pill.open svg:last-child{transform:rotate(180deg)}
.backrow{margin:-6px 0 -4px;display:flex}
.backbtn{height:36px;border-radius:999px;border:2px solid var(--ink);background:var(--fn);box-shadow:0 2px 0 var(--ink);display:inline-flex;align-items:center;gap:4px;padding:0 14px 0 10px;font-size:14px;font-weight:800}

/* drawer */
#drawer .ov{position:fixed;inset:0;background:rgba(92,61,46,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
#drawer .pane{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--bg);border-right:2.5px solid var(--ink);z-index:51;transform:translateX(-106%);transition:transform .3s cubic-bezier(.2,.9,.3,1.05);padding:calc(16px + env(safe-area-inset-top)) 14px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto;box-shadow:5px 0 0 var(--line)}
#drawer.open .ov{opacity:1;pointer-events:auto}
#drawer.open .pane{transform:none}
@keyframes navIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
#drawer.open .navi{animation:navIn .34s cubic-bezier(.2,.9,.3,1.2) backwards}
#drawer.open .navi:nth-of-type(1){animation-delay:.05s}#drawer.open .navi:nth-of-type(2){animation-delay:.08s}#drawer.open .navi:nth-of-type(3){animation-delay:.11s}#drawer.open .navi:nth-of-type(4){animation-delay:.14s}#drawer.open .navi:nth-of-type(5){animation-delay:.17s}#drawer.open .navi:nth-of-type(6){animation-delay:.2s}#drawer.open .navi:nth-of-type(7){animation-delay:.23s}#drawer.open .navi:nth-of-type(8){animation-delay:.26s}
#drawer.open .navi:nth-of-type(9){animation-delay:.29s}
#drawer.still .navi{animation:none}
.sub,.warn,.ttl,.chip,.lbl,p,.cute,.empty{text-wrap:pretty}
.ttl{flex-wrap:wrap;row-gap:2px}
.chip{white-space:normal;text-align:center}
body{overflow-wrap:break-word}
.tool .fr{text-wrap:balance}
.ckeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.ckey{height:60px;border-radius:18px;border:2.5px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);font-family:'Fredoka',sans-serif;font-size:24px;font-weight:500;padding:0;transition:transform .08s ease,box-shadow .08s ease}
.ckey:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.ckey.op{background:var(--lav2)}.ckey.eq{background:var(--butter)}.ckey.fn{background:var(--pink2);font-size:18px}
.cdisp{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:14px 16px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.cdisp .ex{font-size:18px;color:var(--soft);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.cdisp .res{font-family:'Fredoka',sans-serif;font-weight:600;font-size:38px;line-height:1.1;overflow-wrap:anywhere}
.seg.full{width:100%;margin-top:12px}
.qchip{background:var(--fn)}
.chk{background:var(--fn)}
.backrow{justify-content:space-between;gap:8px}
#bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(428px,calc(100% - 20px));height:66px;z-index:15;background:var(--card);border:2.5px solid var(--ink);border-radius:26px;box-shadow:0 4px 0 var(--ink);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 6px}
#bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:800;color:var(--soft);padding:4px 0;border-radius:16px;transition:transform .09s ease}
#bnav button:active{transform:scale(.9)}
#bnav button .bi{width:40px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center}
#bnav button.on{color:var(--ink)}
#bnav button.on .bi{background:var(--butter2)}
#bnav .plus{width:60px;height:60px;margin:-26px auto 0;border-radius:50%;border:2.5px solid var(--ink);background:var(--butter);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:34px;color:var(--ink);padding:0}
#bnav .plus:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#toast{bottom:calc(92px + env(safe-area-inset-bottom))!important}
.coll{display:grid;grid-template-rows:0fr;opacity:0;margin-top:-16px;transition:grid-template-rows .4s cubic-bezier(.2,.8,.3,1),opacity .3s ease,margin-top .4s cubic-bezier(.2,.8,.3,1)}
.coll.open{grid-template-rows:1fr;opacity:1;margin-top:0}
.coll>div{overflow:hidden;min-height:0}
.coll>div>div{padding-bottom:6px}
@keyframes wkL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes wkR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.wkin.l{animation:wkL .28s cubic-bezier(.2,.8,.3,1)}.wkin.r{animation:wkR .28s cubic-bezier(.2,.8,.3,1)}
.ddsel{display:flex;align-items:center;gap:8px;width:100%;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--cream);padding:0 12px;font-size:15px;font-weight:700;text-align:left}
.ddsel.open{border-color:var(--ink);background:#fff}
.ddsel .cv{margin-left:auto;transition:transform .2s;display:flex}
.ddsel.open .cv{transform:rotate(180deg)}
.ddpanel{border:2px solid var(--line);border-radius:16px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px;animation:dropIn .22s cubic-bezier(.2,.9,.3,1.2)}
.pick.missing .ddsel{border-style:dashed;border-color:var(--neg)}
.best{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#2F7A4E;background:#DDF2E4;border:1.5px solid #9CD3B0;border-radius:999px;padding:1px 8px;white-space:nowrap}
.best i{width:8px;height:8px;border-radius:50%;background:#3E9A62;box-shadow:0 0 0 3px rgba(62,154,98,.2);animation:bpulse 1.6s ease-in-out infinite}
@keyframes bpulse{50%{box-shadow:0 0 0 5px rgba(62,154,98,.05)}}
.calcdev{position:relative;background:#DCCDF3;border:3px solid var(--ink);border-radius:36px;padding:16px 16px 20px;box-shadow:0 8px 0 #A992D6,0 8px 0 3px var(--ink)}
.cd-top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.cd-solar{display:flex;gap:2px;background:#5C3D2E;border-radius:6px;padding:3px}
.cd-solar i{width:14px;height:12px;background:#7A6A8E;border-radius:2px}
.cd-screen{background:#D7E8CE;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;text-align:right;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 4px 0 rgba(92,61,46,.12)}
.cd-screen .ex{font-size:17px;color:#6E7F66;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-family:'Fredoka',sans-serif}
.cd-screen .res{font-family:'Fredoka',sans-serif;font-weight:600;font-size:36px;line-height:1.1;color:#3F4E39;overflow-wrap:anywhere}
.calcdev .ckeys{gap:12px;margin-top:16px}
.calcdev .ckey{height:auto;aspect-ratio:1;border-radius:50%;background:#FFFDF8;box-shadow:0 4px 0 var(--ink)}
.calcdev .ckey.op{background:#F9C6D3}.calcdev .ckey.eq{background:var(--butter)}.calcdev .ckey.fn{background:#BFE6CD;font-size:18px}
.calcdev .ckey:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.calcdev .stk{position:absolute;right:-10px;top:-14px;transform:rotate(14deg)}.seg.full button{flex:1;padding:0 6px}
.mchips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;margin:10px -4px 4px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchips .qchip{flex:none}
.qchip.on{background:var(--butter)}
.trash{opacity:.6}
.amtx{text-decoration:line-through}
.tool{display:flex;flex-direction:column;gap:6px;padding:16px 14px;min-height:156px}
.tool .em{font-size:34px;line-height:1}
.ut-av{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;flex:none}
.panicwrap{display:flex;justify-content:center;padding:28px 0 26px}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.panicbtn{border:0;background:transparent;padding:0;cursor:pointer;transition:transform .1s ease;-webkit-tap-highlight-color:transparent}
.panicbtn svg{display:block;animation:jit .32s steps(2) infinite}
.panicbtn:active{transform:translateY(7px) scale(.97)}
@keyframes jit{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(1.5px,-1px) rotate(.7deg)}50%{transform:translate(-1px,1.5px) rotate(-.6deg)}75%{transform:translate(1px,1px) rotate(.4deg)}100%{transform:translate(-1.5px,-.5px) rotate(-.5deg)}}
@media (prefers-reduced-motion:reduce){.panicbtn svg{animation:none}}
.pchips{display:flex;flex-wrap:wrap;gap:8px;max-height:150px;overflow:auto;padding:2px 2px 4px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:36px;border-radius:999px;border:2px solid var(--line);background:var(--cream);font-size:14px;font-weight:700;padding:0 12px 0 9px;max-width:100%;transition:transform .09s ease}
.pchip .dot{width:12px;height:12px;border-width:1.5px}
.pchip.on{border-color:var(--ink);background:var(--butter);box-shadow:0 2px 0 var(--ink)}
.pchip.new{border-style:dashed;border-color:var(--ink);background:var(--card)}
.pchip:active{transform:scale(.94)}
.pick.missing .pchips{outline:2px dashed var(--neg);outline-offset:4px;border-radius:12px}
.sbar{display:flex;height:28px;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--cream)}
.sbar i{display:block;height:100%;border-right:2px solid #FFFDF8;min-width:3px}
.sbar i:last-child{border-right:0}
.ucal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.ucal .wd{font-size:12px;text-align:center;color:var(--soft);padding-bottom:4px}
.uday{height:50px;border-radius:14px;border:2px solid transparent;background:transparent;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:15px}
.uday.today{border-color:var(--ink);background:var(--butter2)}
.uday.past{color:#B9A291}
.uday.has{background:var(--cream)}
.uday.today.has{background:var(--butter2)}
.marks{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.mk{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
.mk.cut{border-radius:2px;background:#DCCDF3}
.mk.due{background:#EE4B55}
.uline{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
.uline+.uline{border-top:1.5px dashed var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.fut-note{background:var(--blue2);border:2px dashed #9CC6DF;border-radius:16px;padding:10px 12px;font-size:14px;text-align:center}
.sgroup+.sgroup{border-top:2px dashed var(--line);margin-top:6px;padding-top:4px}
.navi{display:flex;align-items:center;gap:12px;min-height:52px;border-radius:16px;border:2px solid transparent;background:transparent;padding:4px 10px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px;text-align:left;width:100%}
.navi.on{background:var(--butter2);border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.navi .ic{width:38px;height:38px;border-radius:12px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.navi small{display:block;font-family:'Nunito',sans-serif;font-size:12px;color:var(--soft);font-weight:700}

/* cards */
.card{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--line);padding:18px 16px}
.card.stitch::before{content:'';position:absolute;inset:6px;border:2px dashed var(--line);border-radius:18px;pointer-events:none}
.card>*{position:relative}
.card.tap{cursor:pointer}
.ttl{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.ttl .sub{font-family:'Nunito',sans-serif;font-weight:700;margin-left:auto}
.big{font-family:'Fredoka',sans-serif;font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.5px}
.mid{font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;line-height:1.15}
.sub{font-size:14px;color:var(--soft)}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:var(--card);border:2px solid var(--line);padding:6px 12px;font-size:14px;white-space:nowrap}
.go{font-size:13px;color:var(--soft);display:inline-flex;align-items:center;gap:2px}
.hr{border-top:2px dashed var(--line);margin:12px 0}
.warn{background:var(--pink2);border:2px dashed #F2A8BC;border-radius:16px;padding:10px 12px;font-size:14px}
.hello{padding:0 4px}

/* buttons */
.btn{height:54px;border-radius:999px;border:2.5px solid var(--ink);background:var(--butter);box-shadow:0 3px 0 var(--ink);font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px}
.btn.soft{background:var(--fn);height:46px;font-size:15px}
.btn.sm{height:42px;font-size:15px}
.btn.danger{background:var(--pink2)}
.arrow{width:38px;height:38px;border-radius:12px;border:2px solid var(--ink);background:var(--fn);display:flex;align-items:center;justify-content:center;padding:0;flex:none;box-shadow:0 2px 0 var(--ink)}
.xbtn{width:34px;height:34px;border-radius:12px;border:0;background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.linkbtn{border:0;background:transparent;padding:4px 0;color:var(--soft);font-size:14px;display:inline-flex;align-items:center;gap:4px}
.sortbtn{margin-left:auto;height:30px;border-radius:999px;border:2px solid var(--ink);background:var(--fn);font-size:12px;font-weight:800;padding:0 10px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 0 var(--ink);font-family:'Nunito',sans-serif}

/* entry rows */
.entry{display:flex;flex-direction:column;gap:10px}
.amt{display:flex;align-items:center;gap:8px}
.amt .peso{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;white-space:nowrap}
.inp{width:100%;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--cream);padding:0 12px;outline:none;font-size:16px}
.inp:focus{border-color:var(--ink);background:#fff}
.inp.money{font-family:'Fredoka',sans-serif;font-weight:500;font-size:26px}
.inp::placeholder,.note::placeholder{color:#C9B3A2}
input[type=date].inp{font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px}
.lbl{font-size:12px;color:var(--soft);font-weight:800;letter-spacing:.3px;text-transform:uppercase}

.pwrap{position:relative}.pwrap .inp{padding-right:52px;width:100%}

<script>

function dayBarsMonth(ym){

/* STREAKS + CHALLENGES */
function streakData(f){
  const t=today(),ents=S.entries.filter(e=>num(e.amt)>0&&!e.rec);
  const first=ents.reduce((a,e)=>!a||e.date<a?e.date:a,null);
  if(!first)return {cur:0,best:0,first:null,spentToday:false};
  const dates=new Set(ents.filter(f).map(e=>e.date));
  let cur=0,d=t;while(d>=first&&!dates.has(d)){cur++;d=shift(d,-1);}
  let best=0,run=0;for(let x=first,g=0;x<=t&&g<4000;x=shift(x,1),g++){if(dates.has(x))run=0;else{run++;if(run>best)best=run;}}
  return {cur,best,first,spentToday:dates.has(t)};
}
function chMatch(c,e){if(c.cat&&e.cat!==c.cat)return false;if(c.tag){const tg=c.tag;if(!((e.tags||[]).includes(tg)||(e.note||'').toLowerCase().includes(tg)))return false;}return true;}
function chStatus(c){
  const t=today(),end=shift(c.start,c.days-1),upto=t<end?t:end;
  if(t<c.start)return {state:'upcoming',end,spent:0,n:0,elapsed:0,clean:0,last:null};
  const m=S.entries.filter(e=>num(e.amt)>0&&e.date>=c.start&&e.date<=upto&&chMatch(c,e));
  const spent=m.reduce((a,e)=>a+num(e.amt),0),last=m.reduce((a,e)=>!a||e.date>a?e.date:a,null);
  const elapsed=Math.min(c.days,daysBetween(c.start,upto)+1),clean=last?daysBetween(last,upto):elapsed;
  let state;if(c.cap)state=spent>c.cap?'failed':t>end?'done':'on';else state=m.length?'slipped':t>end?'done':'on';
  return {state,end,spent,n:m.length,elapsed,clean,last};
}
function chWhat(c){return (c.tag?'#'+esc(c.tag):'')+(c.tag&&c.cat?' in ':'')+(c.cat?esc(catInfo(c.cat).name):'');}
function chMini(c){const s=chStatus(c);return '<button type="button" class="tx wrow" data-act="go" data-p="streaks">'+flameSvg(22,s.state==='on')+'<span class="col" style="flex:1;min-width:0"><span class="ell">'+esc(c.name)+'</span><span class="sub ell" style="font-size:12px">'+(c.cap?peso(s.spent)+' of '+peso(c.cap)+' used':s.clean+' clean day'+(s.clean===1?'':'s'))+' · day '+s.elapsed+' of '+c.days+'</span></span></button>';}

let sp={total:'',people:['Me'],mode:'equal',custom:{},cat:'',pay:'',note:''};
function splitCalc(){const base=num(sp.total);let shares,assigned=0;
  if(sp.mode==='equal'){const n=sp.people.length;shares=sp.people.map(()=>n?base/n:0);assigned=base;}
  else{shares=sp.people.map((_,i)=>num(sp.custom[i]));assigned=shares.reduce((a,v)=>a+v,0);}
  return {base,shares,assigned};}
function splitUpdate(){const r=splitCalc();r.shares.forEach((v,i)=>{const el=$('#sp_s_'+i);if(el)el.textContent=peso(v);});
  const f=$('#sp_foot');if(f)f.innerHTML=sp.mode==='custom'&&r.base&&Math.abs(r.assigned-r.base)>.004?'<span class="negc">'+(r.assigned<r.base?peso(r.base-r.assigned)+' not assigned yet':'assigned '+peso(r.assigned-r.base)+' too much')+'</span>':'total: <b>'+peso(r.base)+'</b>';}
function splitSave(){
  const r=splitCalc(),err=$('#sp_err'),cat=val('sp_cat'),pay=val('sp_pay'),note=val('sp_note');
  if(!(r.base>0)){err.textContent='type the bill amount';return;}
  if(sp.people.length<2){err.textContent='add at least one friend';return;}
  if(sp.mode==='custom'&&Math.abs(r.assigned-r.base)>.004){err.textContent='the amounts don\'t add up to the bill yet';return;}
  if(!cat||!pay){err.textContent='pick what it was for and how you paid';return;}
  const pt=payInfo(pay).type,wallet=pt==='credit'?'':'w:'+pay,ts=Date.now(),t=today();let n=0;
  if(r.shares[0]>0)S.entries.push({id:uid(),date:t,amt:r.shares[0].toFixed(2),cat,pay,note:'split'+(note?': '+note:''),tags:[],ts});
  sp.people.forEach((who,i)=>{if(i===0||!(r.shares[i]>0))return;S.utang.push({id:uid(),dir:'lent',who,amt:+r.shares[i].toFixed(2),date:t,ts:ts+i,note:'split'+(note?': '+note:''),wallet,pays:[]});n++;});
  sp={total:'',people:['Me'],mode:'equal',custom:{},cat:'',pay:'',note:''};
  save();rerender();toast('your share logged + '+n+' utang added');
}

/* CALCULATOR */
let calc={expr:''},calcRef=false;
function calcSafe(x){x=String(x).replace(/[+\-*/.]+$/,'');if(!x||!/^[0-9+\-*/().\s]+$/.test(x))return NaN;try{const v=Function('"use strict";return ('+x+')')();return isFinite(v)?v:NaN;}catch(_){return NaN;}}
function calcVal(e){e=(e==null?calc.expr:e).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  let out='',last=0,m;const re=/(\d*\.?\d+)%/g;
  while((m=re.exec(e))){const before=out+e.slice(last,m.index),op=before.slice(-1);let rep;
    if(op==='+'||op==='-'){const lv=calcSafe(before.slice(0,-1));rep=isNaN(lv)?'('+m[1]+'/100)':'('+lv+'*'+m[1]+'/100)';}else rep='('+m[1]+'/100)';
    out=before+rep;last=re.lastIndex;}
  return calcSafe(out+e.slice(last));}
const calcFmt=v=>isNaN(v)?'':(Math.round(v*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
function calcUpdate(){const ex=$('#c_ex'),rs=$('#c_res');if(!ex)return;ex.textContent=calc.expr||' ';const v=calcVal();rs.textContent=calc.expr?(isNaN(v)?'…':calcFmt(v)):'0';ex.scrollLeft=ex.scrollWidth;}
function calcKey(k){
  const ops='+−×÷';let e=calc.expr;
  if(k==='AC')e='';else if(k==='del')e=e.slice(0,-1);
  else if(k==='='){const v=calcVal();if(!isNaN(v)&&/[+−×÷%]/.test(e)){S.calcHist.unshift({e,r:Math.round(v*100)/100,ts:Date.now()});S.calcHist=S.calcHist.slice(0,30);save();e=String(Math.round(v*100)/100);calc.expr=e;rerender();return;}if(!isNaN(v))e=String(Math.round(v*100)/100);}
  else if(ops.includes(k)){if(!e&&k!=='−')return;if(ops.includes(e.slice(-1)))e=e.slice(0,-1);e+=k;}
  else if(k==='.'){const lastNum=e.split(/[+−×÷]/).pop();if(lastNum.includes('.'))return;e+=(lastNum===''?'0':'')+'.';}
  else if(k==='%'){if(/[0-9]$/.test(e))e+='%';}
  else e+=k;
  calc.expr=e.slice(0,60);calcUpdate();
}

  update(){
    const q=srch.q.trim().toLowerCase();
    let r=S.entries.filter(e=>num(e.amt)>0);
    if(srch.m)r=r.filter(e=>e.date.startsWith(srch.m));

        g.l.map(e=>{const c=catInfo(e.cat),p=payInfo(e.pay);return '<div class="tx"><span class="dot" style="width:12px;height:12px;background:'+c.color+'"></span><span class="col" style="flex:1;min-width:0"><span class="ell">'+esc(e.note||c.name)+'</span><span class="sub ell" style="font-size:12px">'+(e.note?esc(c.name)+' · ':'')+esc(p.name)+'</span></span><span class="fr" style="font-weight:500">'+peso(e.amt)+'</span></div>';}).join('')+'</div>').join('')+
        (r.length>150?'<div class="sub" style="text-align:center;font-size:13px;padding-top:8px">showing the newest 150. add a filter to narrow it down.</div>':'')+'</div>'
        :'<div class="empty"><span class="cute" style="font-size:21px">nothing found</span></div>');
  }
};

let manualPage=null;
function curPage(){const map={year:'sum',month:'sum',cards:'money'};let id='';if(manualPage)id=manualPage;else{try{id=(location.hash||'').slice(1);}catch(e){}}if(!id)id='day';if(map[id])id=map[id];return P[id]?id:'day';}
function render(){
  BALC=null;CYC=null;
  const t=today(),tm=t.slice(0,7);
  if(!S.sel)S.sel=t;
  try{document.title=S.title||'Money Log';}catch(_){}
  if(!viewMonth||viewMonth>tm)viewMonth=tm;
  if(!flowMonth||flowMonth>tm)flowMonth=tm;
  if(!tfMonth||tfMonth>tm)tfMonth=tm;
  if(!inMonth||inMonth>tm)inMonth=tm;
  if(!viewYear||viewYear>+t.slice(0,4))viewYear=+t.slice(0,4);
  const p=curPage(),app=$('#app');
  app.innerHTML=topBar(p)+P[p].html();

  if(p!==lastPage){app.classList.remove('swap');void app.offsetWidth;app.classList.add('swap');clearTimeout(render.t);render.t=setTimeout(()=>app.classList.remove('swap'),600);lastPage=p;}

}

let sw=null;
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(!drawerOpen&&x<22&&$('#lock').hidden)sw={x,y:e.touches[0].clientY,mode:'open'};else if(drawerOpen)sw={x,y:e.touches[0].clientY,mode:'close'};else sw=null;},{passive:true});

document.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=Math.abs(e.touches[0].clientY-sw.y);if(dy>40){sw=null;return;}

async function hashPin(p){
  const s='moneylog:'+p;
  try{if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}}catch(e){}
  let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return 'f'+(h>>>0).toString(16);
}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rand=n=>crypto.getRandomValues(new Uint8Array(n));

async function pressKey(k){
  if(k==='bio'){bioUnlock();return;}
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);}else if(pinBuf.length<(S.lock.len||4))pinBuf+=k;
  document.querySelectorAll('#pdots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
  if(pinBuf.length===(S.lock.len||4)){
    if(await hashPin(pinBuf)===S.lock.hash){unlock();}
    else{const d=$('#pdots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');pinBuf='';setTimeout(()=>document.querySelectorAll('#pdots i').forEach(i=>i.classList.remove('on')),250);}
  }

async function bioUnlock(){

  try{await navigator.credentials.get({publicKey:{challenge:rand(32),allowCredentials:[{type:'public-key',id:unb64(S.lock.bio)}],userVerification:'required',timeout:60000}});unlock();}catch(e){}
}

    case 'addcat':addItem('cats','newcat');return;

    case 'carddates':cardDatesModal(payOf(id));return;
    case 'savedates':{const cut=val('cd_cut'),due=val('cd_due'),err=$('#cd_err');

      if(due&&due<=cut){err.textContent='the due date should come after the cut-off';return;}
      if(cut<td&&!due){err.textContent='this cut-off already passed, so add its due date too';return;}
      if(due&&due<td){err.textContent='that bill\'s due date already passed. use the next statement\'s dates instead.';return;}
      if(due&&daysBetween(cut,due)>62){err.textContent='the due date looks too far from the cut-off';return;}
      const p=payOf(id);p.cutA=cut;p.dueA=due||null;save();closeModal();rerender();toast('dates saved ✓');return;}

    case 'stmtreset':{const c=payOf(id);if(c.ov)delete c.ov[b.dataset.k];save();closeModal();rerender();toast('back to normal ✓');return;}
    case 'savestmt':{const c=payOf(id),k=b.dataset.k,cy=cycleKey(c,k),err=$('#st_err'),cut=val('st_cut'),due=val('st_due'),a=String(val('st_amt')).trim();

      const nd=c.dueA?addMonthsDate(c.dueA,cy.k):null,o={};
      if(cut!==k)o.cut=cut;if(due&&due!==nd)o.due=due;if(a!==''&&num(a)>=0)o.amt=num(a);
      c.ov=c.ov||{};if(Object.keys(o).length)c.ov[k]=o;else delete c.ov[k];
      save();closeModal();rerender();toast('statement updated ✓');return;}
    case 'billpaid':{const k=b.dataset.k,c=payOf(id),si=stmtInfo(c,cycleKey(c,k));

    case 'delinc':{const inc=S.income.find(x=>x.id===id);askConfirm('Delete '+peso(inc.amt)+' from '+(inc.src||'money in')+'?','Delete',()=>removeAnimated('[data-row="'+id+'"]',()=>{trashIt('income',inc);S.income=S.income.filter(x=>x.id!==id);S.moves.forEach(m=>{if(m.link===id)m.link=null;});}));return;}

        S.lock.hash=await hashPin(p1);S.lock.len=p1.length;save();closeModal();rerender();toast('PIN lock on 🔒');
      })();return;}
    case 'bio':if(b.dataset.v==='on'){if(!S.lock.bio)bioSetup();}else{S.lock.bio=null;save();rerender();}return;
    /* year / flow */
    case 'yrpick':yrPick=b.dataset.m;rerender();P.year.update();return;
    case 'yrtab':yrTab=b.dataset.v;rerender();return;
    case 'flowtoggle':flowOpen=!flowOpen;rerender();return;

    case 'uttab':utTab=b.dataset.v;rerender();return;
    case 'addut':utangModal();return;
    case 'editut':utangModal(id);return;
    case 'utdir':{const d=b.dataset.v;document.querySelectorAll('#ut_dir button').forEach(x=>x.classList.toggle('on',x===b));$('[data-act=saveut]').dataset.dir=d;$('#ut_wholbl').textContent=d==='lent'?'Who owes you':'Who you owe';const wl=$('#ut_wlbl');if(wl)wl.textContent=d==='lent'?'Taken from':'Goes into';return;}
    case 'saveut':{const who=val('ut_who'),amt=num(val('ut_amt')),dir=b.dataset.dir,err=$('#ut_err');
      if(!who){err.textContent='add a name';return;}if(!(amt>0)){err.textContent='type an amount';return;}
      if(id){const u=S.utang.find(x=>x.id===id);if(amt<utPaid(u)-.005){err.textContent='that\'s less than what\'s been paid already';return;}Object.assign(u,{who,amt,dir,note:val('ut_note')});}
      else{const nid=uid();S.utang.push({id:nid,dir,who,amt,date:today(),ts:Date.now(),note:val('ut_note'),wallet:val('ut_wallet'),pays:[]});justAdded.add(nid);}
      utTab=dir;save();closeModal();rerender();toast(id?'saved ✓':'utang added 🤝');return;}
    case 'utpay':utPayModal(id);return;
    case 'saveutpay':{const u=S.utang.find(x=>x.id===id),amt=num(val('up_amt')),err=$('#up_err');
      if(!(amt>0)){err.textContent='type an amount';return;}
      if(amt>utLeft(u)+.005){err.textContent='that\'s more than what\'s left ('+peso(utLeft(u))+')';return;}
      u.pays.push({id:uid(),amt,date:today(),ts:Date.now(),wallet:val('up_wallet')});save();closeModal();rerender();toast(utLeft(u)<=.004?'all settled with '+u.who+' ✓':peso(amt)+' recorded ✓');return;}
    case 'utsettle':{const u=S.utang.find(x=>x.id===id),left=utLeft(u);if(left<=0)return;
      askConfirm('Mark '+peso(left)+' as all settled with '+u.who+'?'+(u.wallet?' It goes '+(u.dir==='lent'?'into':'out of')+' '+refInfo(u.wallet).name+'.':''),'Settled ✓',()=>{u.pays.push({id:uid(),amt:left,date:today(),ts:Date.now(),wallet:u.wallet||''});save();rerender();toast('all settled with '+u.who+' ✓');});return;}
    case 'utdel':{const u=S.utang.find(x=>x.id===id);if(!u)return;askConfirm('Delete this utang with '+u.who+'? Any wallet changes it made get undone.','Delete',()=>removeAnimated('[data-row="'+id+'"]',()=>{trashIt('utang',u);S.utang=S.utang.filter(x=>x.id!==id);}));return;}
    /* repeating */
    case 'addrec':recModal();return;
    case 'editrec':recModal(id);return;
    case 'rfreq':{document.querySelectorAll('#rc_freq button').forEach(x=>x.classList.toggle('on',x===b));$('[data-act=saverec]').dataset.freq=b.dataset.v;$('#rc_prev').innerHTML=recPreview(b.dataset.v,val('rc_start'));return;}
    case 'rccolor':{document.querySelectorAll('#rc_colors button').forEach(x=>x.classList.toggle('on',x===b));$('[data-act=saverec]').dataset.color=b.dataset.v;return;}
    case 'reccolor':{const r=S.recs.find(x=>x.id===id);const i=SWATCHES.indexOf(r.color);r.color=SWATCHES[(i+1)%SWATCHES.length];break;}
    case 'saverec':{const name=val('rc_name'),amt=num(val('rc_amt')),start=val('rc_start'),freq=b.dataset.freq,err=$('#rc_err');
      if(!name){err.textContent='what is it called?';return;}if(!(amt>0)){err.textContent='type an amount';return;}

      let r;
      if(id){r=S.recs.find(x=>x.id===id);Object.assign(r,fields);}
      else{r=Object.assign({id:uid(),k:0,paused:false},fields);S.recs.push(r);justAdded.add(r.id);}
      const after=r.last&&r.last>today()?r.last:today();recSkipPast(r,after);
      save();closeModal();rerender();toast('saved ✓ next one: '+shortDay(recOcc(r,r.k)));return;}
    case 'recpause':{const r=S.recs.find(x=>x.id===id);if(!r)return;
      if(r.paused){r.paused=false;recSkipPast(r,today());toast('resumed ▶ next one: '+shortDay(recOcc(r,r.k)));}
      else{r.paused=true;toast('paused ⏸');}
      break;}
    case 'recdel':{const r=S.recs.find(x=>x.id===id);if(!r)return;askConfirm('Stop repeating "'+r.name+'"? The expenses it already added stay.','Delete',()=>removeAnimated('[data-row="'+id+'"]',()=>{S.recs=S.recs.filter(x=>x.id!==id);}));return;}

    /* panic */
    case 'panic1':openModal('<div class="col" style="align-items:center;text-align:center;gap:6px"><span style="font-size:54px;line-height:1">😰</span><span class="fr" style="font-size:24px">are you sure?</span><span class="sub">this clears everything in the app.</span></div><div class="grid2"><button type="button" class="btn soft" data-act="closemodal">No</button><button type="button" class="btn sm" style="background:#FFB3B3" data-act="panic2">Yes</button></div>');return;
    case 'panic2':openModal('<div class="col" style="align-items:center;text-align:center;gap:6px"><span style="font-size:60px;line-height:1">😳</span><span class="fr" style="font-size:26px">are you SURE sure?</span><span class="sub">'+(cloudOn()?'it clears your other synced devices too. (the cloud keeps 3 weeks of backups, just in case)':'there\'s no undo. everything goes poof.')+'</span></div><div class="col g10"><button type="button" class="btn soft" data-act="closemodal">No, take me back</button><button type="button" class="btn sm" style="background:#EE4B55;color:#fff" data-act="panic3">Yes, delete it all</button></div>');return;
    case 'panic3':{preSnap('before panic button');S=defaults();fixup(null);save();closeModal();navStack.length=0;viewMonth=flowMonth=tfMonth=inMonth=null;yrPick=null;setHash('home');setTimeout(()=>toast('poof! fresh start ✿'),200);return;}

  }

document.addEventListener('click',e=>{if(e.target.id==='xc_date'&&e.target.showPicker){try{e.target.showPicker();}catch(_){}}
  if(e.target.id==='disc'){hideDiscard();return;}
  if(e.target.id==='modal'){tryCloseModal();return;}
  const k=e.target.closest('[data-key]');if(k){pressKey(k.dataset.key);return;}
  const b=e.target.closest('[data-act]');if(b&&!b.disabled)handleAct(b,e);
});
document.addEventListener('input',e=>{if(e.target.id==='xc_amt'&&xf&&xf.sp)setTimeout(spInfo,0);
  const el=e.target,k=el.dataset.in;if(!k)return;const id=el.dataset.id;
  if(k==='amt'){el.value=decimal(el.value);S.entries.find(x=>x.id===id).amt=el.value;save();P.day.update();return;}
  if(k==='dec'){el.value=decimal(el.value);if(el.id==='bg_amt')bgInfo();return;}
  if(k==='sq'){srch.q=el.value;P.search.update();return;}
  if(k==='rcdate'){const pv=$('#rc_prev');if(pv)pv.innerHTML=recPreview($('[data-act=saverec]').dataset.freq,el.value);return;}
  if(k==='sptot'){el.value=decimal(el.value);sp.total=el.value;splitUpdate();return;}
  if(k==='spsvcin'){el.value=decimal(el.value);sp.svc=num(el.value);splitUpdate();return;}
  if(k==='spc'){el.value=decimal(el.value);sp.custom[el.dataset.i]=el.value;splitUpdate();return;}
  if(k==='xspin'){return;}
  if(k==='xwho'){xf.who=el.value.trim();$('#xc_who').innerHTML=whoChips();utInfo();return;}
  if(k==='xtq'){xf.tq=el.value;updTags();return;}
  if(k==='xq'){xf.q=el.value;$('#xc_cats').innerHTML=catChips();return;}
  if(k==='note'){S.entries.find(x=>x.id===id).note=el.value;save();return;}
  if(k==='name'){S.name=el.value.trim();save();return;}
  if(k==='title'){S.title=el.value.trim()||'Money Log';try{document.title=S.title;}catch(_){}save();return;}
  if(k==='catname'){const v=el.value.trim();if(v){catOf(id).name=v;save();}return;}
  if(k==='payname'){const v=el.value.trim();if(v){payOf(id).name=v;save();}return;}
});
document.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.in;
  if(k==='cat'||k==='pay'){const en=S.entries.find(x=>x.id===el.dataset.id);en[k]=el.value;save();rerender();return;}
  if(k==='catname'||k==='payname'){rerender();return;}
  if(el.id==='pd_pig'){$('#pd_chips').innerHTML=pdChips();return;}
  if(el.id==='tf_from'){const w=$('#tf_all');if(w)w.innerHTML=tfAllChip(el.value);return;}
  if(el.id==='xc_date'){if(!el.value)return;xf.date=el.value>today()?today():el.value;const l=$('#xc_dlbl');if(l)l.textContent=xf.date===today()?'today':shortDay(xf.date);repInfo();return;}
  if(k==='cur'){S.cur=el.value;save();rerender();toast('currency: '+el.value);return;}
  if(el.id==='sp_cat'){sp.cat=el.value;return;}if(el.id==='sp_pay'){sp.pay=el.value;return;}
  if(k==='sm'||k==='scat'||k==='spay'){srch[{sm:'m',scat:'cat',spay:'pay'}[k]]=el.value;P.search.update();return;}
  if(k==='mito'){const pig=el.value.startsWith('pig:');$('#mi_untilrow').classList.toggle('hidden',pig);$('#mi_hint').textContent=pig?'saving it straight into a piggy bank ✿':'';return;}
  if(el.id==='restoreFile'&&el.files&&el.files[0])doRestore(el.files[0]);
});
document.addEventListener('keydown',e=>{
  if(curPage()==='calc'&&$('#modal').hidden&&!(e.target.tagName==='INPUT')){const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'del','Escape':'AC','%':'%','.':'.'};const k=/^\d$/.test(e.key)?e.key:m[e.key];if(k){e.preventDefault();calcKey(k);return;}}
  if(!$('#lock').hidden){if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('del');return;}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!$('#modal').hidden){const pb=$('#modal .mfoot .btn:not(.soft)')||$('#modal .grid2 .btn:not(.soft)');if(pb){e.preventDefault();pb.click();}return;}
  if(keyNav(e))return;
  if(e.key==='Escape'){if(drawerOpen){closeDrawer();return;}if(calOpen){closeCal();return;}if(!$('#disc').hidden){hideDiscard();return;}if(!$('#modal').hidden){tryCloseModal();return;}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card.tap,[role=button]')){e.preventDefault();handleAct(e.target);return;}

function download(name,text,type){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();

function doBackup(){

function doCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['type','date','amount ('+S.cur+')','category','paid with / from','to','note'];
  const rows=[];
  S.entries.filter(e=>num(e.amt)>0).forEach(e=>rows.push(['expense',e.date,num(e.amt).toFixed(2),catInfo(e.cat).name,payInfo(e.pay).name,'',e.note||'']));
  S.income.forEach(i=>rows.push(['money in',i.date,num(i.amt).toFixed(2),'',i.src||'',refInfo(i.to).name,i.until?'use until '+i.until:'']));
  S.moves.forEach(m=>rows.push([m.to.startsWith('card:')?'card bill paid':'transfer',m.date,num(m.amt).toFixed(2),'',refInfo(m.from).name,refInfo(m.to).name,m.note||'']));
  S.utang.forEach(u=>{rows.push([u.dir==='lent'?'lent (utang)':'borrowed (utang)',u.date,num(u.amt).toFixed(2),'',u.who,u.wallet?refInfo(u.wallet).name:'',u.note||'']);(u.pays||[]).forEach(p=>rows.push([u.dir==='lent'?'utang paid back to you':'utang you paid back',p.date,num(p.amt).toFixed(2),'',u.who,p.wallet?refInfo(p.wallet).name:'','']));});
  rows.sort((a,b)=>a[1].localeCompare(b[1]));
  download('moneylog-'+toYMD(new Date())+'.csv','﻿'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\n'),'text/csv');

function doRestore(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!Array.isArray(o.entries))throw 0;
      askConfirm('Restore this backup? It replaces everything in the app now.','Restore',()=>{preSnap('before restoring a file');S=merge(defaults(),o);fixup(o);save();rerender();toast('backup restored!');});}catch(e){toast('that file is not a backup');}
    $('#restoreFile').value='';};
  r.readAsText(file);

async function api(method,path,body,extra,retry){

/* ---- push / pull ---- */
async function push(){
  const keys=Object.keys(SY.dirty);if(!keys.length)return 0;
  const cur=syncRecords();
  for(let i=0;i<keys.length;i+=300){
    const part=keys.slice(i,i+300),stamp={};
    const rows=part.map(k=>{const [kind,id]=k.split(SEP),o=cur.get(k);stamp[k]=SY.dirty[k];
      return {user_id:myId(),kind,id,data:o===undefined?null:o,deleted:o===undefined,updated_at:SY.dirty[k]};});
    await api('POST','/rest/v1/items?on_conflict=user_id,kind,id',rows,{Prefer:'resolution=merge-duplicates,return=minimal'});
    part.forEach(k=>{if(SY.dirty[k]===stamp[k])delete SY.dirty[k];});saveSY();
  }
  return keys.length;
}
function applyRow(r){
  const k=r.kind+SEP+r.id,d=SY.dirty[k];
  if(d!==undefined&&d>r.updated_at)return false;          // this phone's edit is newer
  if(d!==undefined)delete SY.dirty[k];
  if(r.kind==='meta'){if(r.deleted||!r.data)return false;const hh=hashOf(r.data);if(SY.lh[k]===hh&&hashOf(metaObj())===hh)return false;
    META.forEach(f=>{if(f in r.data&&r.data[f]!==null)S[f]=r.data[f];});SY.lh[k]=hashOf(metaObj());return true;}
  if(!ARR.includes(r.kind))return false;
  const arr=S[r.kind]||(S[r.kind]=[]),ix=arr.findIndex(o=>String(o.id)===r.id);
  if(r.deleted||!r.data){delete SY.lh[k];if(ix>=0){arr.splice(ix,1);return true;}return false;}
  const hh=hashOf(r.data);
  if(ix>=0&&hashOf(arr[ix])===hh){SY.lh[k]=hh;return false;}
  if(ix>=0)arr[ix]=r.data;else arr.push(r.data);
  SY.lh[k]=hh;return true;
}
async function pull(){
  let since=SY.lastPull,first=true,changed=0;
  for(let g=0;g<200;g++){
    let q='/rest/v1/items?select=kind,id,data,deleted,updated_at,server_at&user_id=eq.'+myId()+'&order=server_at.asc&limit=1000';
    if(since){const s=first?new Date(new Date(since).getTime()-3000).toISOString():since;q+='&server_at=gt.'+encodeURIComponent(s);}
    first=false;
    const rows=await api('GET',q)||[];
    rows.forEach(r=>{if(applyRow(r))changed++;});
    if(rows.length)since=rows[rows.length-1].server_at;
    if(rows.length<1000)break;
  }
  SY.lastPull=since;saveSY();
  return changed;
}

let syncing=null,syncAgain=false;

  if(!cloudOn())return;

    if(!navigator.onLine){setSS('offline');return;}

      SY.lastSync=Date.now();saveSY();setSS('ok');

  if(m==='newpw')body=fld('au_pw','New password','password','at least 6 characters','','new-password')+go('aunewpw','Save new password');
  if(m==='sent')body=go('aumode','Back to log in').replace('data-act="aumode"','data-act="aumode" data-v="login"');
  return '<div class="abox">'+cloudPig()+'<div class="cute" style="font-size:30px;line-height:1.1;margin-top:6px">'+T[0]+'</div>'+(T[1]?'<div class="sub" style="max-width:320px">'+T[1]+'</div>':'')+
    '<div class="card stitch acard">'+note+body+'</div>'+
    (m!=='newpw'&&m!=='config'?'<button type="button" class="linkbtn askip" data-act="auskip">use without an account (this '+deviceName().toLowerCase()+' only)</button>':'')+
    (m==='config'?'<button type="button" class="linkbtn askip" data-act="auskip">not now</button>':'')+'</div>';
}
function friendly(e){
  const m=String(e&&e.message||'').toLowerCase(),c=String(e&&e.code||'');
  if(e&&e.offline)return 'no internet right now. try again when you\'re online.';
  if(c==='invalid_credentials'||m.includes('invalid login'))return 'wrong email or password';
  if(c==='email_not_confirmed'||m.includes('not confirmed'))return 'confirm your email first. check your inbox (and spam).';
  if(c==='user_already_exists'||m.includes('already registered'))return 'that email already has an account. log in instead.';
  if(c==='weak_password'||m.includes('password should')||m.includes('at least'))return 'password needs at least 6 characters';
  if(c==='signup_disabled'||m.includes('signups not allowed')||m.includes('signup is disabled'))return 'new accounts are turned off for this cloud.';
  if(c.includes('rate_limit')||m.includes('rate limit'))return 'too many tries. wait a minute, then try again.';
  if(c==='validation_failed'&&m.includes('email'))return 'that email doesn\'t look right';
  if(m.includes('api key')||m.includes('apikey'))return 'the cloud key doesn\'t look right. check it in cloud settings.';
  return 'hmm, that didn\'t work ('+(e&&e.message||'unknown error')+')';
}
async function authSubmit(a,b){
  const err=t=>showAuth(authMode,t),label=b.textContent;b.disabled=true;b.textContent='one sec…';
  try{
    if(a==='auconfig'){
      let url=val('au_url').trim().replace(/\/+$/,''),key=val('au_key').trim();
      if(url&&!/^https?:\/\//.test(url))url='https://'+url;
      if(!/^https:\/\/[^\s/]+$/.test(url)){b.disabled=false;b.textContent=label;err('the URL should look like https://something.supabase.co');return;}
      if(!key){b.disabled=false;b.textContent=label;err('paste the publishable key too');return;}
      if(/service_role|sb_secret_/.test(key)||(key.split('.').length===3&&/service_role/.test(atob((key.split('.')[1]||'').replace(/-/g,'+').replace(/_/g,'/'))))){b.disabled=false;b.textContent=label;err('careful! that\'s the SECRET key. use the publishable (or anon) key instead, and keep the secret one private.');return;}
      let ok=false;try{const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key}});ok=r.ok;}catch(e){b.disabled=false;b.textContent=label;err('couldn\'t reach that URL. check it, and that you\'re online.');return;}
      if(!ok){b.disabled=false;b.textContent=label;err('the cloud said no. double-check the publishable key.');return;}
      AU.url=url;AU.key=key;AU.skip=false;saveAU();showAuth('login','connected! now log in or make your account ✿',true);return;
    }
    if(a==='aunewpw'){const pw=val('au_pw');if(pw.length<6){b.disabled=false;b.textContent=label;err('password needs at least 6 characters');return;}
      await ensureToken();await authCall('user',{password:pw},AU.session.access_token,'PUT');afterLogin('new password saved ✿');return;}
    const em=val('au_em').trim().toLowerCase();AU.lastEmail=em;saveAU();
    if(!/^\S+@\S+\.\S+$/.test(em)){b.disabled=false;b.textContent=label;err('type your email');return;}
    if(a==='auforgot'){await authCall('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:em});showAuth('sent','if '+em+' has an account, a reset link is on its way. open it on this device.',true);return;}
    const pw=val('au_pw');if(!pw){b.disabled=false;b.textContent=label;err('type your password');return;}
    if(a==='aulogin'){const j=await authCall('token?grant_type=password',{email:em,password:pw});setSession(j);afterLogin();return;}
    if(a==='ausignup'){if(pw.length<6){b.disabled=false;b.textContent=label;err('password needs at least 6 characters');return;}
      const j=await authCall('signup',{email:em,password:pw});
      if(j.access_token){setSession(j);afterLogin('account made! welcome ✿');}
      else showAuth('sent','we sent a confirmation link to '+em+'. open it on this device, then come back and log in.',true);return;}
  }catch(e){err(friendly(e));}
}
function afterLogin(msg){
  const id=myId();if(SY.uid!==id){SY=syDefaults();SY.uid=id;saveSY();}
  hideAuth();rerender();toast(msg||'hi! syncing your stuff ✿');setTimeout(()=>syncNow(),300);
}
async function logOut(){
  try{if(navigator.onLine&&SY.ready){scan();if(pendingN())await push();}}catch(e){}
  try{await authCall('logout',{},AU.session&&AU.session.access_token);}catch(e){}
  AU.session=null;AU.skip=false;saveAU();SY=syDefaults();saveSY();SS='idle';rerender();showAuth('login','logged out. your money log is still on this '+deviceName().toLowerCase()+' ✿',true);
}

document.addEventListener('focusout',e=>{if(e.target.id==='xc_spin'&&xf){const n=e.target.value.trim();if(n&&!xf.spp.includes(n)){xf.spp.push(n);e.target.value='';$('#xc_spp').innerHTML=spChips();spInfo();}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.closest||!e.target.closest('#auth'))return;const p=$('#auth [data-primary]');if(p&&!p.disabled){e.preventDefault();p.click();}});

function readAuthHash(){
  const hs=location.hash||'';if(!/access_token=|error_code=|[#&]error=/.test(hs))return null;
  const p=new URLSearchParams(hs.replace(/^#/,''));try{location.hash='home';}catch(e){}return p;
}
async function handleAuthHash(p){
  if(p.get('error')||p.get('error_code')){setTimeout(()=>toast(p.get('error_code')==='otp_expired'?'that link expired. ask for a new one ✿':'that link didn\'t work'),400);return;}
  const tok=p.get('access_token');if(!tok||!cloudSet())return;
  try{const u=await authCall('user',null,tok,'GET');setSession({access_token:tok,refresh_token:p.get('refresh_token'),expires_at:p.get('expires_at'),expires_in:p.get('expires_in'),user:u});
    if(p.get('type')==='recovery')showAuth('newpw');else afterLogin('email confirmed! welcome ✿');}catch(e){toast(friendly(e));}
}
