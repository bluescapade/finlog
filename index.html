function makeICS(cards){
  const t=today(),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Money Log//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Money Log'];
  const ev=(u,d,title,desc)=>{L.push('BEGIN:VEVENT','UID:'+u+'@moneylog','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d.replace(/-/g,''),'DTEND;VALUE=DATE:'+shift(d,1).replace(/-/g,''),'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(desc),'TRANSP:TRANSPARENT',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:-PT39H','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:PT9H','END:VALARM','END:VEVENT');};
  let n=0;
  cards.forEach(c=>{if(!c||!c.cutA)return;const cur=cycleAt(c,t);
    for(let k=cur.k-1;k<=cur.k+11;k++){const cy=cycleK(c,k);if(!cy.due||cy.due<t)continue;ev(c.id+'-'+cy.key,cy.due,c.name+' due ('+esoaName(cy)+')','Pay your '+c.name+' '+esoaName(cy)+' today. Money Log has the amount.');n++;}
    if(c.feeMonth){const y=+t.slice(0,4);let d=ymd(y,+c.feeMonth,1);if(d<t)d=ymd(y+1,+c.feeMonth,1);ev(c.id+'-fee-'+d.slice(0,4),d,c.name+' annual fee','Ask the bank to waive your annual fee.');n++;}});
  L.push('END:VCALENDAR');return {txt:L.join('\r\n'),n};
}

function doCSV(){

function doRestore(file){

      askConfirm('Restore this backup? It replaces everything in the app now.','Restore',()=>{preSnap('before restoring a file');S=merge(defaults(),o);fixup(o);save();rerender();toast('backup restored!');});}catch(e){toast('that file is not a backup');}
    $('#restoreFile').value='';};
  r.readAsText(file);
}

function billItems(){
  const t=today(),a=shift(t,-60),[ny,nm]=addMonth(+t.slice(0,4),+t.slice(5,7),1),b=ymd(ny,nm,dim(ny,nm)),items=[];

  if(d!==undefined)delete SY.dirty[k];
  if(r.kind==='meta'){if(r.deleted||!r.data)return false;const hh=hashOf(r.data);if(SY.lh[k]===hh&&hashOf(metaObj())===hh)return false;
    META.forEach(f=>{if(f in r.data&&r.data[f]!==null)S[f]=r.data[f];});SY.lh[k]=hashOf(metaObj());return true;}
  if(!ARR.includes(r.kind))return false;
  const arr=S[r.kind]||(S[r.kind]=[]),ix=arr.findIndex(o=>String(o.id)===r.id);
  if(r.deleted||!r.data){delete SY.lh[k];if(ix>=0){arr.splice(ix,1);return true;}return false;}
  const hh=hashOf(r.data);

  const iv=setInterval(()=>{if($('#modal').hidden){clearInterval(iv);if(askFirst.res){const f=askFirst.res;askFirst.res=null;f(null);}}},400);
});}
async function firstSync(){
  const has=((await api('GET','/rest/v1/items?select=id&user_id=eq.'+myId()+'&limit=1'))||[]).length>0;
  const localHas=(S.entries.length+S.income.length+S.moves.length+S.utang.length+(S.bills||[]).length)>0;
  let mode='merge';
  if(has&&localHas){mode=await askFirst();if(!mode){const x=new Error('wait');x.wait=true;throw x;}}
  else if(has)mode='cloud';
  if(mode==='cloud'){lsSet('moneylog-before-cloud',S);ARR.forEach(k=>{S[k]=[];});}
  SY.lh={};SY.dirty={};SY.lastPull=null;saveSY();
  await pull();
  if(!S.cats.length)S.cats=defaults().cats;
  if(!S.pays.length)S.pays=defaults().pays;
  SY.ready=true;saveSY();
  remoteChanged();
  scan();await push();
  return mode;
}

/* ---- the sync loop ---- */
let syncing=null,syncAgain=false;
async function syncNow(manual){
  if(!cloudOn())return;
  if(syncing){syncAgain=true;return syncing;}
  syncing=(async()=>{
    if(!navigator.onLine){setSS('offline');return;}
    setSS('busy');
    try{
      await ensureToken();
      let pulled=0,first=false;
      if(!SY.ready){const m=await firstSync();first=true;toast(m==='cloud'?'your money log is here ✿':'all synced ✿');}
      else{scan();await push();pulled=await pull();if(pulled)remoteChanged();}
      const g=runRepeats();if(g){scan();await push();remoteChanged();}
      SY.lastSync=Date.now();saveSY();setSS('ok');
      if(manual&&!first)toast(pulled?'synced · '+pulled+' update'+(pulled>1?'s':'')+' came in ✿':'all synced ✓');
      maybeSnapshot();
    }catch(e){
      if(e.offline)setSS('offline');
      else if(e.auth){setSS('auth');rerender();}
      else if(e.wait)setSS('wait','tap to finish setting up sync');
      else{setSS('err',e.message);if(manual)toast('couldn\'t sync: '+e.message);}
    }
  })();
  try{await syncing;}finally{syncing=null;if(syncAgain){syncAgain=false;setTimeout(()=>syncNow(),400);}}
}
function setSS(s,msg){SS=s;SSmsg=msg||'';updSync();}
function ago(ms){if(!ms)return 'never';const s=(Date.now()-ms)/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';const d=new Date(ms);return shortDay(toYMD(d))+', '+clock(ms);}
function pillState(){
  const n=pendingN(),w=n?n+' change'+(n>1?'s':'')+' waiting':'';
  if(!loggedIn())return ['','☁ only on this phone · log in to sync'];
  if(SS==='busy')return ['busy','syncing…'];
  if(SS==='offline'||!navigator.onLine)return ['wait','offline · '+(w||'all saved on this phone')];
  if(SS==='auth')return ['err','log in again to keep syncing'];
  if(SS==='wait')return ['wait','tap to finish setting up sync'];
  if(SS==='err')return ['err','couldn\'t sync · tap to retry'];
  if(n)return ['wait',w];
  if(SY.lastSync)return ['ok','synced '+ago(SY.lastSync)];
  return ['wait','tap to sync'];
}

}

/* ---- daily cloud snapshots ---- */
function deviceName(){const u=navigator.userAgent;if(/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))return 'iPad';if(/iPhone/.test(u))return 'iPhone';if(/Android/.test(u))return /Mobile/.test(u)?'Android phone':'Android tablet';if(/Macintosh/.test(u))return 'Mac';if(/Windows/.test(u))return 'Windows laptop';return 'device';}
async function snapshotNow(note,data){await api('POST','/rest/v1/snapshots',{user_id:myId(),device:deviceName(),note,data},{Prefer:'return=minimal'});}
function preSnap(note){if(!cloudOn()||!SY.ready)return;const d=snapData();snapshotNow(note,d).catch(()=>{});}
async function maybeSnapshot(){
  if(!SY.ready||SY.lastSnap===today())return;
  try{await snapshotNow('daily',snapData());SY.lastSnap=today();saveSY();
    await api('DELETE','/rest/v1/snapshots?created_at=lt.'+encodeURIComponent(new Date(Date.now()-21*864e5).toISOString()),null,{Prefer:'return=minimal'});}catch(e){}
}
async function snapsModal(){
  openModal('<span class="fr" style="font-size:20px">Cloud backups ☁️</span><span class="sub">one copy a day, kept for 3 weeks. tap one to go back to how things were then.</span><div id="snaplist" class="col"><div class="sub">loading…</div></div><button type="button" class="btn soft sm" data-act="closemodal">Close</button>');

      :'<div class="sub">no backups yet. the first one gets made on your next sync ✿</div>';}
  catch(e){html='<div class="sub">'+esc(friendly(e))+'</div>';}

async function restoreSnap(id,t){
  try{const rows=await api('GET','/rest/v1/snapshots?select=data&id=eq.'+encodeURIComponent(id));if(!rows||!rows[0])throw new Error('not found');
    await snapshotNow('before going back',snapData()).catch(()=>{});
    const d=rows[0].data,keep={lock:S.lock,sel:S.sel,lastBackup:S.lastBackup};
    S=merge(defaults(),d);Object.assign(S,keep);fixup(d);save();rerender();toast('back to '+t+' ✿');
  }catch(e){toast(friendly(e));}
}

let authMode='login';
function showAuth(mode,msg,ok){authMode=mode||(cloudSet()?'login':'config');if(!cloudSet()&&authMode!=='config')authMode='config';const A=$('#auth');A.classList.remove('closing');A.hidden=false;A.innerHTML=authHtml(msg,ok);A.scrollTop=0;}
function hideAuth(){const A=$('#auth');if(A.hidden)return;A.classList.add('closing');setTimeout(()=>{A.hidden=true;A.innerHTML='';A.classList.remove('closing');},250);}
function authHtml(msg,ok){
  const m=authMode,note=msg?'<div class="'+(ok?'aok':'aerr')+'">'+esc(msg)+'</div>':'';
  const fld=(id,label,type,ph,v,ac)=>'<label class="col g6"><span class="lbl">'+label+'</span>'+(type==='password'?'<div class="pwrap"><input class="inp" type="password" id="'+id+'" placeholder="'+ph+'" autocomplete="'+ac+'"><button type="button" class="eye" data-act="aueye" aria-label="Show password">👁</button></div>':'<input class="inp" type="'+type+'" id="'+id+'" placeholder="'+ph+'" value="'+esc(v||'')+'" autocomplete="'+(ac||'off')+'" autocapitalize="off" spellcheck="false">')+'</label>';
  const go=(act,l)=>'<button type="button" class="btn" data-act="'+act+'" data-primary="1">'+l+'</button>';
  const em=(AU.lastEmail||'');
  const T={config:['connect your cloud ☁️','paste two things from your Supabase project (Settings › API keys). you only do this once on each device.'],
    login:['welcome back ✿','log in so all your devices share one money log'],
    signup:['make your account','just for you. use an email you can open, and a password you\'ll remember.'],

    newpw:['make a new password','almost there! pick a new password for your account.'],
    sent:['check your email 💌','']}[m]||['',''];
  let body='';
  if(m==='config')body=fld('au_url','Project URL','url','https://xxxx.supabase.co',AU.url,'off')+fld('au_key','Publishable key','text','sb_publishable_…',AU.key,'off')+go('auconfig','Connect');
  if(m==='login')body=fld('au_em','Email','email','you@email.com',em,'username')+fld('au_pw','Password','password','your password','','current-password')+go('aulogin','Log in')+
    '<div class="row sb"><button type="button" class="linkbtn" data-act="aumode" data-v="forgot">forgot password?</button><button type="button" class="linkbtn" data-act="aumode" data-v="signup">new here? sign up</button></div>';
  if(m==='signup')body=fld('au_em','Email','email','you@email.com',em,'username')+fld('au_pw','Password','password','at least 6 characters','','new-password')+go('ausignup','Create my account')+
    '<button type="button" class="linkbtn" style="align-self:center" data-act="aumode" data-v="login">already have one? log in</button>';
  if(m==='forgot')body=fld('au_em','Email','email','you@email.com',em,'username')+go('auforgot','Send me a link')+'<button type="button" class="linkbtn" style="align-self:center" data-act="aumode" data-v="login">back to log in</button>';
  if(m==='newpw')body=fld('au_pw','New password','password','at least 6 characters','','new-password')+go('aunewpw','Save new password');
  if(m==='sent')body=go('aumode','Back to log in').replace('data-act="aumode"','data-act="aumode" data-v="login"');
  return '<div class="abox">'+cloudPig()+'<div class="cute" style="font-size:30px;line-height:1.1;margin-top:6px">'+T[0]+'</div>'+(T[1]?'<div class="sub" style="max-width:320px">'+T[1]+'</div>':'')+
    '<div class="card stitch acard">'+note+body+'</div>'+
    (m!=='newpw'&&m!=='config'?'<button type="button" class="linkbtn askip" data-act="auskip">use without an account (this '+deviceName().toLowerCase()+' only)</button>':'')+
    (m==='config'?'<button type="button" class="linkbtn askip" data-act="auskip">not now</button>':'')+'</div>';
}
function friendly(e){
  const m=String(e&&e.message||'').toLowerCase(),c=String(e&&e.code||'');
  if(e&&e.offline)return 'no internet right now. try again when you\'re online.';
  if(c==='invalid_credentials'||m.includes('invalid login'))return 'wrong email or password';
  if(c==='email_not_confirmed'||m.includes('not confirmed'))return 'confirm your email first. check your inbox (and spam).';
  if(c==='user_already_exists'||m.includes('already registered'))return 'that email already has an account. log in instead.';
  if(c==='weak_password'||m.includes('password should')||m.includes('at least'))return 'password needs at least 6 characters';
  if(c==='signup_disabled'||m.includes('signups not allowed')||m.includes('signup is disabled'))return 'new accounts are turned off for this cloud.';
  if(c.includes('rate_limit')||m.includes('rate limit'))return 'too many tries. wait a minute, then try again.';
  if(c==='validation_failed'&&m.includes('email'))return 'that email doesn\'t look right';
  if(m.includes('api key')||m.includes('apikey'))return 'the cloud key doesn\'t look right. check it in cloud settings.';
  return 'hmm, that didn\'t work ('+(e&&e.message||'unknown error')+')';
}
async function authSubmit(a,b){
  const err=t=>showAuth(authMode,t),label=b.textContent;b.disabled=true;b.textContent='one sec…';
  try{
    if(a==='auconfig'){
      let url=val('au_url').trim().replace(/\/+$/,''),key=val('au_key').trim();
      if(url&&!/^https?:\/\//.test(url))url='https://'+url;
      if(!/^https:\/\/[^\s/]+$/.test(url)){b.disabled=false;b.textContent=label;err('the URL should look like https://something.supabase.co');return;}
      if(!key){b.disabled=false;b.textContent=label;err('paste the publishable key too');return;}
      if(/service_role|sb_secret_/.test(key)||(key.split('.').length===3&&/service_role/.test(atob((key.split('.')[1]||'').replace(/-/g,'+').replace(/_/g,'/'))))){b.disabled=false;b.textContent=label;err('careful! that\'s the SECRET key. use the publishable (or anon) key instead, and keep the secret one private.');return;}
      let ok=false;try{const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key}});ok=r.ok;}catch(e){b.disabled=false;b.textContent=label;err('couldn\'t reach that URL. check it, and that you\'re online.');return;}
      if(!ok){b.disabled=false;b.textContent=label;err('the cloud said no. double-check the publishable key.');return;}
      AU.url=url;AU.key=key;AU.skip=false;saveAU();showAuth('login','connected! now log in or make your account ✿',true);return;
    }
    if(a==='aunewpw'){const pw=val('au_pw');if(pw.length<6){b.disabled=false;b.textContent=label;err('password needs at least 6 characters');return;}
      await ensureToken();await authCall('user',{password:pw},AU.session.access_token,'PUT');afterLogin('new password saved ✿');return;}
    const em=val('au_em').trim().toLowerCase();AU.lastEmail=em;saveAU();
    if(!/^\S+@\S+\.\S+$/.test(em)){b.disabled=false;b.textContent=label;err('type your email');return;}
    if(a==='auforgot'){await authCall('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:em});showAuth('sent','if '+em+' has an account, a reset link is on its way. open it on this device.',true);return;}
    const pw=val('au_pw');if(!pw){b.disabled=false;b.textContent=label;err('type your password');return;}
    if(a==='aulogin'){const j=await authCall('token?grant_type=password',{email:em,password:pw});setSession(j);afterLogin();return;}
    if(a==='ausignup'){if(pw.length<6){b.disabled=false;b.textContent=label;err('password needs at least 6 characters');return;}
      const j=await authCall('signup',{email:em,password:pw});
      if(j.access_token){setSession(j);afterLogin('account made! welcome ✿');}
      else showAuth('sent','we sent a confirmation link to '+em+'. open it on this device, then come back and log in.',true);return;}
  }catch(e){err(friendly(e));}
}
function afterLogin(msg){
  const id=myId();if(SY.uid!==id){SY=syDefaults();SY.uid=id;saveSY();}
  hideAuth();rerender();toast(msg||'hi! syncing your stuff ✿');setTimeout(()=>syncNow(),300);
}
async function logOut(){
  try{if(navigator.onLine&&SY.ready){scan();if(pendingN())await push();}}catch(e){}
  try{await authCall('logout',{},AU.session&&AU.session.access_token);}catch(e){}
  AU.session=null;AU.skip=false;saveAU();SY=syDefaults();saveSY();SS='idle';rerender();showAuth('login','logged out. your money log is still on this '+deviceName().toLowerCase()+' ✿',true);
}

function readAuthHash(){
  const hs=location.hash||'';if(!/access_token=|error_code=|[#&]error=/.test(hs))return null;
  const p=new URLSearchParams(hs.replace(/^#/,''));try{location.hash='home';}catch(e){}return p;
}
async function handleAuthHash(p){
  if(p.get('error')||p.get('error_code')){setTimeout(()=>toast(p.get('error_code')==='otp_expired'?'that link expired. ask for a new one ✿':'that link didn\'t work'),400);return;}
  const tok=p.get('access_token');if(!tok||!cloudSet())return;
  try{const u=await authCall('user',null,tok,'GET');setSession({access_token:tok,refresh_token:p.get('refresh_token'),expires_at:p.get('expires_at'),expires_in:p.get('expires_in'),user:u});
    if(p.get('type')==='recovery')showAuth('newpw');else afterLogin('email confirmed! welcome ✿');}catch(e){toast(friendly(e));}
}
