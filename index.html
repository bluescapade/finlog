<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Log</title>
<meta name="theme-color" content="#FBF1E6">
<script>(function(){var t="light";try{t=localStorage.getItem("moneylog-theme")||"light";}catch(e){}if(t==="auto"){try{t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}catch(e){t="light";}}document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#1C1714":t==="soft"?"#36302B":"#FBF1E6";})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Gaegu:wght@700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--fn:#F2E2D1;
  --bg:#FBF1E6;--card:#FFFDF8;--ink:#5C3D2E;--soft:#8F6E5C;--line:#E3CDB8;--cream:#FFF6EA;
  --butter:#F7D774;--butter2:#FBE7A6;--pink:#F6B8C8;--pink2:#FDE3EA;--mint2:#DDF2E4;--blue2:#E1EFF7;--lav2:#ECE4FA;--peach2:#FDE6D6;
  --neg:#C2476A;--good:#3E8A5E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.fr{font-family:'Fredoka',system-ui,sans-serif;font-weight:600}
.cute{font-family:'Gaegu',cursive;font-weight:700}
#app{max-width:460px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sb{justify-content:space-between}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--good)}.negc{color:var(--neg)}
.hidden{display:none!important}

/* ---- animations ---- */
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes dropIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sinkOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(22px) scale(.9)}}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-7px) rotate(-1deg)}75%{transform:translateX(7px) rotate(1deg)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.enter{animation:popIn .32s cubic-bezier(.2,.9,.3,1.25) backwards}
.swap>*{animation:popIn .32s cubic-bezier(.2,.9,.3,1.2) backwards}
.swap>*:nth-child(2){animation-delay:.03s}.swap>*:nth-child(3){animation-delay:.06s}.swap>*:nth-child(4){animation-delay:.09s}.swap>*:nth-child(5){animation-delay:.12s}.swap>*:nth-child(n+6){animation-delay:.15s}
.swap>.top{animation:none}
.leaving{height:0!important;opacity:0;transform:scale(.95);padding-top:0!important;padding-bottom:0!important;border-width:0!important;margin-top:-16px;overflow:hidden;transition:height .22s ease,opacity .18s ease,transform .2s ease,padding .22s ease,margin .22s ease}
.leaving.tight{margin-top:0}
.bob{animation:bob 3.2s ease-in-out infinite}
.shake{animation:shake .38s ease}
@media (prefers-reduced-motion:reduce){.enter,.swap>*,.bob{animation:none}.leaving{transition:none}}

/* press animation */
.btn,.ibtn,.pill,.arrow,.card,.day,.swbtn,.xbtn,.tog,.chk,.mbox,.qchip,.seg button,.backbtn,.sortbtn,.navi,.pigbtn,.wrow,.key{transition:transform .09s ease,box-shadow .09s ease}
.btn:not(:disabled):active,.ibtn:active,.pill:active,.arrow:not(:disabled):active,.tog:active,.chk:active,.mbox:not(:disabled):active,.qchip:active,.seg button:active,.backbtn:active,.sortbtn:active,.key:not(.ghost):active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.card:active{transform:translateY(2px) scale(.995);box-shadow:0 1px 0 var(--line)}
.card.tap:active{transform:translateY(3px) scale(.985)}
.day:not(:disabled):active,.swbtn:active,.xbtn:active,.pigbtn:active{transform:scale(.9)}
.navi:active,.wrow:active{transform:scale(.97)}

/* top bar */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:8px 0;background:linear-gradient(var(--bg) 78%,transparent)}
.ibtn{width:48px;height:48px;border-radius:16px;border:2.5px solid var(--edge);background:var(--fn);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 0 var(--sh);flex:none}
.ibtn.on{background:var(--butter)}
.pill{flex:1;min-width:0;height:48px;border-radius:999px;border:2.5px solid var(--edge);background:var(--fn);box-shadow:0 3px 0 var(--sh);display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;padding:0 12px;white-space:nowrap}
.pill svg{transition:transform .2s;flex:none}
.pill.open svg:last-child{transform:rotate(180deg)}
.backrow{margin:-6px 0 -4px;display:flex}
.backbtn{height:36px;border-radius:999px;border:2px solid var(--edge);background:var(--fn);box-shadow:0 2px 0 var(--sh);display:inline-flex;align-items:center;gap:4px;padding:0 14px 0 10px;font-size:14px;font-weight:800}

/* drawer */
#drawer .ov{position:fixed;inset:0;background:rgba(92,61,46,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
#drawer .pane{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--bg);border-right:2.5px solid var(--edge);z-index:51;transform:translateX(-106%);transition:transform .3s cubic-bezier(.2,.9,.3,1.05);padding:calc(16px + env(safe-area-inset-top)) 14px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto;box-shadow:5px 0 0 var(--line)}
#drawer.open .ov{opacity:1;pointer-events:auto}
#drawer.open .pane{transform:none}
@keyframes navIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
#drawer.open .navi{animation:navIn .34s cubic-bezier(.2,.9,.3,1.2) backwards}
#drawer.open .navi:nth-of-type(1){animation-delay:.05s}#drawer.open .navi:nth-of-type(2){animation-delay:.08s}#drawer.open .navi:nth-of-type(3){animation-delay:.11s}#drawer.open .navi:nth-of-type(4){animation-delay:.14s}#drawer.open .navi:nth-of-type(5){animation-delay:.17s}#drawer.open .navi:nth-of-type(6){animation-delay:.2s}#drawer.open .navi:nth-of-type(7){animation-delay:.23s}#drawer.open .navi:nth-of-type(8){animation-delay:.26s}
#drawer.open .navi:nth-of-type(9){animation-delay:.29s}
#drawer.still .navi{animation:none}
.sub,.warn,.ttl,.chip,.lbl,p,.cute,.empty{text-wrap:pretty}
.ttl{flex-wrap:wrap;row-gap:2px}
.chip{white-space:normal;text-align:center}
body{overflow-wrap:break-word}
.tool .fr{text-wrap:balance}
.ckeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.ckey{height:60px;border-radius:18px;border:2.5px solid var(--edge);background:var(--card);box-shadow:0 3px 0 var(--sh);font-family:'Fredoka',sans-serif;font-size:24px;font-weight:500;padding:0;transition:transform .08s ease,box-shadow .08s ease}
.ckey:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.ckey.op{background:var(--lav2)}.ckey.eq{background:var(--butter)}.ckey.fn{background:var(--pink2);font-size:18px}
.cdisp{background:var(--card);border:2.5px solid var(--edge);border-radius:20px;padding:14px 16px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.cdisp .ex{font-size:18px;color:var(--soft);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.cdisp .res{font-family:'Fredoka',sans-serif;font-weight:600;font-size:38px;line-height:1.1;overflow-wrap:anywhere}
.seg.full{width:100%;margin-top:12px}
.qchip{background:var(--fn)}
.chk{background:var(--fn)}
.backrow{justify-content:space-between;gap:8px}
#bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(428px,calc(100% - 20px));height:66px;z-index:15;background:var(--card);border:2.5px solid var(--edge);border-radius:26px;box-shadow:0 4px 0 var(--sh);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 6px}
#bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:800;color:var(--soft);padding:4px 0;border-radius:16px;transition:transform .09s ease}
#bnav button:active{transform:scale(.9)}
#bnav button .bi{width:40px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center}
#bnav button.on{color:var(--ink)}
#bnav button.on .bi{background:var(--butter2)}
#bnav .plus{width:60px;height:60px;margin:-26px auto 0;border-radius:50%;border:2.5px solid var(--edge);background:var(--butter);box-shadow:0 4px 0 var(--sh);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:34px;color:var(--ink);padding:0}
#bnav .plus:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
#toast{bottom:calc(92px + env(safe-area-inset-bottom))!important}
.coll{display:grid;grid-template-rows:0fr;opacity:0;margin-top:-16px;transition:grid-template-rows .4s cubic-bezier(.2,.8,.3,1),opacity .3s ease,margin-top .4s cubic-bezier(.2,.8,.3,1)}
.coll.open{grid-template-rows:1fr;opacity:1;margin-top:0}
.coll>div{overflow:hidden;min-height:0}
.coll>div>div{padding-bottom:6px}
@keyframes wkL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes wkR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.wkin.l{animation:wkL .28s cubic-bezier(.2,.8,.3,1)}.wkin.r{animation:wkR .28s cubic-bezier(.2,.8,.3,1)}
.ddsel{display:flex;align-items:center;gap:8px;width:100%;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--cream);padding:0 12px;font-size:15px;font-weight:700;text-align:left}
.ddsel.open{border-color:var(--edge);background:var(--white)}
.ddsel .cv{margin-left:auto;transition:transform .2s;display:flex}
.ddsel.open .cv{transform:rotate(180deg)}
.ddpanel{border:2px solid var(--line);border-radius:16px;background:var(--white);padding:10px;display:flex;flex-direction:column;gap:8px;animation:dropIn .22s cubic-bezier(.2,.9,.3,1.2)}
.pick.missing .ddsel{border-style:dashed;border-color:var(--neg)}
.best{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#2F7A4E;background:#DDF2E4;border:1.5px solid #9CD3B0;border-radius:999px;padding:1px 8px;white-space:nowrap}
.best i{width:8px;height:8px;border-radius:50%;background:#3E9A62;box-shadow:0 0 0 3px rgba(62,154,98,.2);animation:bpulse 1.6s ease-in-out infinite}
@keyframes bpulse{50%{box-shadow:0 0 0 5px rgba(62,154,98,.05)}}
.calcdev{position:relative;background:#DCCDF3;border:3px solid var(--edge);border-radius:36px;padding:16px 16px 20px;box-shadow:0 8px 0 #A992D6,0 8px 0 3px var(--ink)}
.cd-top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.cd-solar{display:flex;gap:2px;background:#5C3D2E;border-radius:6px;padding:3px}
.cd-solar i{width:14px;height:12px;background:#7A6A8E;border-radius:2px}
.cd-screen{background:#D7E8CE;border:2.5px solid var(--edge);border-radius:18px;padding:12px 14px;text-align:right;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 4px 0 rgba(92,61,46,.12)}
.cd-screen .ex{font-size:17px;color:#6E7F66;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-family:'Fredoka',sans-serif}
.cd-screen .res{font-family:'Fredoka',sans-serif;font-weight:600;font-size:36px;line-height:1.1;color:#3F4E39;overflow-wrap:anywhere}
.calcdev .ckeys{gap:12px;margin-top:16px}
.calcdev .ckey{height:auto;aspect-ratio:1;border-radius:50%;background:#FFFDF8;box-shadow:0 4px 0 var(--sh)}
.calcdev .ckey.op{background:#F9C6D3}.calcdev .ckey.eq{background:var(--butter)}.calcdev .ckey.fn{background:#BFE6CD;font-size:18px}
.calcdev .ckey:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.calcdev .stk{position:absolute;right:-10px;top:-14px;transform:rotate(14deg)}.seg.full button{flex:1;padding:0 6px}
.mchips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;margin:10px -4px 4px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchips .qchip{flex:none}
.qchip.on{background:var(--butter)}
.trash{opacity:.6}
.amtx{text-decoration:line-through}
.tool{display:flex;flex-direction:column;gap:6px;padding:16px 14px;min-height:156px}
.tool .em{font-size:34px;line-height:1}
.ut-av{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--edge);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;flex:none}
.panicwrap{display:flex;justify-content:center;padding:28px 0 26px}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.panicbtn{border:0;background:transparent;padding:0;cursor:pointer;transition:transform .1s ease;-webkit-tap-highlight-color:transparent}
.panicbtn svg{display:block;animation:jit .32s steps(2) infinite}
.panicbtn:active{transform:translateY(7px) scale(.97)}
@keyframes jit{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(1.5px,-1px) rotate(.7deg)}50%{transform:translate(-1px,1.5px) rotate(-.6deg)}75%{transform:translate(1px,1px) rotate(.4deg)}100%{transform:translate(-1.5px,-.5px) rotate(-.5deg)}}
@media (prefers-reduced-motion:reduce){.panicbtn svg{animation:none}}
.pchips{display:flex;flex-wrap:wrap;gap:8px;max-height:150px;overflow:auto;padding:2px 2px 4px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:36px;border-radius:999px;border:2px solid var(--line);background:var(--cream);font-size:14px;font-weight:700;padding:0 12px 0 9px;max-width:100%;transition:transform .09s ease}
.pchip .dot{width:12px;height:12px;border-width:1.5px}
.pchip.on{border-color:var(--edge);background:var(--butter);box-shadow:0 2px 0 var(--sh)}
.pchip.new{border-style:dashed;border-color:var(--edge);background:var(--card)}
.pchip:active{transform:scale(.94)}
.pick.missing .pchips{outline:2px dashed var(--neg);outline-offset:4px;border-radius:12px}
.sbar{display:flex;height:28px;border:2.5px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--cream)}
.sbar i{display:block;height:100%;border-right:2px solid #FFFDF8;min-width:3px}
.sbar i:last-child{border-right:0}
.ucal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.ucal .wd{font-size:12px;text-align:center;color:var(--soft);padding-bottom:4px}
.uday{height:50px;border-radius:14px;border:2px solid transparent;background:transparent;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:15px}
.uday.today{border-color:var(--edge);background:var(--butter2)}
.uday.past{color:#B9A291}
.uday.has{background:var(--cream)}
.uday.today.has{background:var(--butter2)}
.marks{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.mk{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--edge)}
.mk.cut{border-radius:2px;background:#DCCDF3}
.mk.due{background:#EE4B55}
.uline{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
.uline+.uline{border-top:1px solid var(--hair)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.fut-note{background:var(--blue2);border:2px dashed #9CC6DF;border-radius:16px;padding:10px 12px;font-size:14px;text-align:center}
.sgroup+.sgroup{border-top:1px solid var(--hair);margin-top:6px;padding-top:4px}
.navi{display:flex;align-items:center;gap:12px;min-height:52px;border-radius:16px;border:2px solid transparent;background:transparent;padding:4px 10px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px;text-align:left;width:100%}
.navi.on{background:var(--butter2);border-color:var(--edge);box-shadow:0 2px 0 var(--sh)}
.navi .ic{width:38px;height:38px;border-radius:12px;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;flex:none}
.navi small{display:block;font-family:'Nunito',sans-serif;font-size:12px;color:var(--soft);font-weight:700}

/* cards */
.card{position:relative;background:var(--card);border:2.5px solid var(--edge);border-radius:24px;box-shadow:0 4px 0 var(--line);padding:18px 16px}
.card.stitch::before{content:'';position:absolute;inset:6px;border:1px solid var(--hair);border-radius:18px;pointer-events:none}
.card>*{position:relative}
.card.tap{cursor:pointer}
.ttl{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.ttl .sub{font-family:'Nunito',sans-serif;font-weight:700;margin-left:auto}
.big{font-family:'Fredoka',sans-serif;font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.5px}
.mid{font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;line-height:1.15}
.sub{font-size:14px;color:var(--soft)}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:var(--card);border:2px solid var(--line);padding:6px 12px;font-size:14px;white-space:nowrap}
.go{font-size:13px;color:var(--soft);display:inline-flex;align-items:center;gap:2px}
.hr{border-top:1px solid var(--hair);margin:12px 0}
.warn{background:var(--pink2);border:2px dashed #F2A8BC;border-radius:16px;padding:10px 12px;font-size:14px}
.hello{padding:0 4px}

/* buttons */
.btn{height:54px;border-radius:999px;border:2.5px solid var(--edge);background:var(--butter);box-shadow:0 3px 0 var(--sh);font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px}
.btn.soft{background:var(--fn);height:46px;font-size:15px}
.btn.sm{height:42px;font-size:15px}
.btn.danger{background:var(--pink2)}
.arrow{width:38px;height:38px;border-radius:12px;border:2px solid var(--edge);background:var(--fn);display:flex;align-items:center;justify-content:center;padding:0;flex:none;box-shadow:0 2px 0 var(--sh)}
.xbtn{width:34px;height:34px;border-radius:12px;border:0;background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.linkbtn{border:0;background:transparent;padding:4px 0;color:var(--soft);font-size:14px;display:inline-flex;align-items:center;gap:4px}
.sortbtn{margin-left:auto;height:30px;border-radius:999px;border:2px solid var(--edge);background:var(--fn);font-size:12px;font-weight:800;padding:0 10px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 0 var(--sh);font-family:'Nunito',sans-serif}

/* entry rows */
.entry{display:flex;flex-direction:column;gap:10px}
.amt{display:flex;align-items:center;gap:8px}
.amt .peso{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;white-space:nowrap}
.inp{width:100%;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--cream);padding:0 12px;outline:none;font-size:16px}
.inp:focus{border-color:var(--edge);background:var(--white)}
.inp.money{font-family:'Fredoka',sans-serif;font-weight:500;font-size:26px}
.inp::placeholder,.note::placeholder{color:#C9B3A2}
input[type=date].inp{font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px}
.lbl{font-size:12px;color:var(--soft);font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.sel{appearance:none;-webkit-appearance:none;width:100%;height:44px;border-radius:14px;border:2px solid var(--line);background-color:var(--cream);padding:0 30px 0 12px;outline:none;font-size:15px;font-weight:700;color:var(--ink);background-image:var(--caret);background-repeat:no-repeat;background-position:right 10px center;background-size:14px}
.sel:focus{border-color:var(--edge)}
.sel.empty{border-style:dashed;border-color:var(--pink);color:var(--soft);background-color:var(--pink2)}
.note{width:100%;height:36px;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:0 4px;outline:none;font-size:15px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--edge);flex:none}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchip{height:34px;border-radius:999px;border:2px solid var(--edge);background:var(--cream);box-shadow:0 2px 0 var(--sh);font-size:13px;font-weight:800;padding:0 12px}

/* overlays */
.calwrap{position:fixed;inset:0;z-index:20;background:rgba(92,61,46,.18);display:flex;justify-content:center;align-items:flex-start;padding:calc(72px + env(safe-area-inset-top)) 16px 16px;animation:fadeIn .18s ease}
.calwrap .card{width:100%;max-width:428px;animation:dropIn .26s cubic-bezier(.2,.9,.3,1.2)}
.calwrap.noanim,.calwrap.noanim .card{animation:none}
.calwrap.closing{animation:fadeOut .16s ease forwards}
.calwrap.closing .card{animation:sinkOut .16s ease forwards}
.calwrap .card:active,#modal .card:active{transform:none;box-shadow:0 4px 0 var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cal .wd{font-size:12px;text-align:center;color:var(--soft);padding-bottom:4px}
.day{height:46px;border-radius:14px;border:2px solid transparent;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px}
.day.has{background:var(--pink2)}
.day.today{border-color:var(--edge)}
.day.sel{background:var(--butter);border-color:var(--edge)}
.day small{font-size:9px;color:var(--soft);font-weight:800}
#modal{position:fixed;inset:0;background:rgba(92,61,46,.25);z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .18s ease}
#modal[hidden]{display:none}
#modal .card{width:100%;max-width:390px;display:flex;flex-direction:column;max-height:88vh;padding:8px;animation:popIn .28s cubic-bezier(.2,.9,.3,1.25)}
.mbody{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0;flex:1 1 auto;padding:12px 10px;overscroll-behavior:contain}
.mfoot+.linkbtn{margin-top:14px}
.mfoot{position:sticky;bottom:-12px;z-index:2;background:var(--card);margin:0 -10px -12px;padding:10px 10px 12px;border-radius:0 0 16px 16px;box-shadow:0 -10px 10px -10px rgba(92,61,46,.25)}
#disc{position:fixed;inset:0;background:rgba(92,61,46,.32);z-index:36;display:flex;align-items:center;justify-content:center;padding:28px;animation:fadeIn .15s ease}
#disc[hidden]{display:none}
#disc .card{width:100%;max-width:330px;padding:8px;animation:popIn .25s cubic-bezier(.2,.9,.3,1.25)}
#disc .card:active{transform:none;box-shadow:0 4px 0 var(--line)}
.tool.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.flame{display:inline-flex;flex:none}
.trend{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}
.trend .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.trend .tb i{display:block;width:100%;border:2px solid var(--edge);border-radius:8px 8px 3px 3px;background:var(--pink)}
.trend .tb i.cur{background:var(--butter)}
.trend .tb span{font-size:11px;color:var(--soft);font-weight:800}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 4px;font-family:'Fredoka',sans-serif;font-weight:600}
.irow{display:flex;align-items:center;gap:10px;padding:10px 0;border:0;background:transparent;width:100%;text-align:left}
.irow+.irow{border-top:1px solid var(--hair)}
#modal.closing{animation:fadeOut .24s ease forwards}
#modal.closing .card{animation:sinkOut .24s cubic-bezier(.4,0,.8,.4) forwards}
#modal .card.nudge{animation:nudge .3s ease}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;pointer-events:none;animation:toastIn .25s cubic-bezier(.2,.9,.3,1.3)}
#toast[hidden]{display:none}

/* lock */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;animation:fadeIn .2s ease}
#lock[hidden]{display:none}
.pdots{display:flex;gap:14px;min-height:20px}
.pdots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--edge);background:transparent;transition:background .1s}
.pdots i.on{background:var(--pink)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.key{height:72px;border-radius:50%;border:2.5px solid var(--edge);background:var(--card);box-shadow:0 3px 0 var(--sh);font-family:'Fredoka',sans-serif;font-size:26px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0}
.key.ghost{border:0;background:transparent;box-shadow:none}

/* settings */
.srow{padding:8px 0}
.srow+.srow{border-top:1px solid var(--hair)}
.swbtn{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--edge);padding:0;flex:none}
.plain{flex:1;min-width:0;height:40px;border:0;background:transparent;outline:none;font-size:16px;border-radius:10px;padding:0 6px}
.plain:focus{background:var(--cream)}
.tog{height:32px;min-width:84px;border-radius:999px;border:2px solid var(--edge);background:var(--fn);font-size:11px;font-weight:800;padding:0 8px;box-shadow:0 2px 0 var(--sh);flex:none}
.tog.cash{background:var(--mint2)}.tog.ewallet{background:var(--blue2)}.tog.credit{background:var(--lav2)}
.seg{display:flex;border:2px solid var(--edge);border-radius:999px;overflow:hidden;box-shadow:0 2px 0 var(--sh)}
.seg button{border:0;background:var(--fn);height:34px;padding:0 14px;font-size:13px;font-weight:800}
.seg button+button{border-left:2px solid var(--edge)}
.seg button.on{background:var(--butter)}
.setrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.setrow>.sub{width:100px;flex:none}

/* lists */
.leg{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.leg+.leg{border-top:1px solid var(--hair)}
.leg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .pc{width:42px;text-align:right;color:var(--soft);font-size:13px}
.rank{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.rank+.rank{border-top:1px solid var(--hair)}
.rnum{width:24px;height:24px;border-radius:50%;border:2px solid var(--edge);background:var(--butter2);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.bar{height:14px;border-radius:99px;background:var(--cream);border:2px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;border-right:2px solid var(--edge)}
.bar i.full{border-right:0}
.bar i.zero{border-right:0}

/* podium */
.podium{display:flex;align-items:flex-end;gap:8px;margin-top:16px;border-bottom:2.5px solid var(--edge);padding:0 4px}
.pcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.pav{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--edge);flex:none}
.pname{font-size:14px;max-width:100%;text-align:center}
.pamt{font-size:13px;color:var(--soft);font-family:'Fredoka',sans-serif;font-weight:500}
.pblock{width:100%;border:2.5px solid var(--edge);border-bottom:0;border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:6px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;margin-top:4px}

/* months grid */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mbox{border:2.5px solid var(--edge);border-radius:18px;background:var(--card);box-shadow:0 3px 0 var(--sh);padding:10px 8px;display:flex;flex-direction:column;gap:4px;text-align:left}
.mbox.cur{background:var(--butter2)}
.mbox:disabled{opacity:.4;box-shadow:none;border-style:dashed}
.mb{height:8px;border-radius:99px;background:var(--cream);border:1.5px solid var(--edge);overflow:hidden}
.mb i{display:block;height:100%;background:var(--pink)}
.mpig{font-size:11px;color:var(--soft);font-weight:800;white-space:nowrap}

/* money */
.cc-head{display:flex;align-items:center;gap:10px}
.cc-chip{width:44px;height:30px;border-radius:8px;border:2.5px solid var(--edge);flex:none;position:relative}
.cc-chip::after{content:'';position:absolute;left:6px;top:7px;width:12px;height:9px;border-radius:3px;background:#F6E2B8;border:1.5px solid var(--edge)}
.stmt{border-radius:18px;background:var(--cream);border:2px solid var(--line);padding:12px}
.chk{display:flex;align-items:center;gap:8px;height:38px;border-radius:999px;border:2px solid var(--edge);background:var(--card);box-shadow:0 2px 0 var(--sh);font-size:13px;font-weight:800;padding:0 12px 0 8px;flex:none}
.chk .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--edge);background:var(--white);display:flex;align-items:center;justify-content:center}
.chk.on{background:#CDEBD6}
.chk.on .box{background:var(--good)}
.tx{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.tx+.tx{border-top:1px solid var(--hair)}
.flow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}
.flow+.flow{border-top:1px solid var(--hair)}
.flow .nm{flex:1;min-width:0}
.flow.total{border-top:2.5px solid var(--edge)!important;margin-top:4px;padding-top:10px}
.sign{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:14px;line-height:1;flex:none}
.prog{height:18px;border-radius:99px;background:var(--card);border:2.5px solid var(--edge);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pink);border-right:2.5px solid var(--edge)}
.wsec{border-radius:18px;border:2px solid var(--line);padding:4px 12px;background:var(--card)}
.wsec+.wsec{margin-top:10px}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 0;border:0;background:transparent;width:100%;text-align:left;font-size:15px}
.wrow+.wrow{border-top:1px solid var(--hair)}
.ref{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:2px solid var(--line);background:var(--cream);padding:2px 9px 2px 5px;font-size:13px;max-width:132px;min-width:0}
.ref .dot{width:11px;height:11px;border-width:1.5px}
.mv{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.mv+.mv{border-top:1px solid var(--hair)}

/* piggies */
.pigfield{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 18px;padding:10px 0 4px}
.pigspot{display:flex}
.pigbtn{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pigbtn .nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;max-width:150px}
.pigbtn .am{font-size:13px;color:var(--soft)}
.pigbtn .gb{width:70px;height:7px;border-radius:9px;border:1.5px solid var(--edge);background:var(--card);overflow:hidden;margin-top:2px}
.pigbtn .gb i{display:block;height:100%;background:var(--good)}
.colorpick{display:flex;gap:10px;flex-wrap:wrap}
.colorpick button{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--edge);padding:0;box-shadow:0 2px 0 var(--sh)}
.colorpick button.on{outline:3px solid var(--edge);outline-offset:3px}
.empty{text-align:center;padding:10px 0 4px}
.edtag{display:inline-block;font-size:11px;font-weight:700;background:var(--butter2);border:1.5px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink2,#7a5a48);vertical-align:1px}
.stbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;align-items:flex-start;text-align:left}
.uline.done{opacity:.5}
.mtool{width:100%;display:flex;align-items:center;gap:12px;padding:9px 2px;background:none;border:0;border-top:1px solid var(--hair);font:inherit;color:inherit;cursor:pointer}
.mtool:first-of-type{border-top:0}
.mtic{width:44px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
#toast.nudge{pointer-events:auto}
#xc_utw.missing{outline:2px dashed var(--neg);outline-offset:4px;border-radius:12px}
#auth{position:fixed;inset:0;z-index:140;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 18px 32px;animation:fadeIn .25s ease}
#auth[hidden]{display:none!important}
#auth.closing{animation:fadeOut .25s ease forwards}
@keyframes fadeOut{to{opacity:0}}
.abox{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin:auto 0}
.acard{width:100%;text-align:left;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.aerr{background:var(--pink2);border:2px dashed #F28BA8;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--neg)}
.aok{background:#E4F4E9;border:2px dashed #9CD3B0;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700}
.pwrap{position:relative}.pwrap .inp{padding-right:52px;width:100%}
.pwrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:36px;border:0;background:none;font-size:18px;cursor:pointer}
.askip{margin-top:14px;font-size:13px;opacity:.85}
.cpig{position:relative;width:180px;height:160px;flex:none}
.cpig-p{position:absolute;left:42px;top:26px}
.cpig-c{position:absolute;left:4px;bottom:0;width:172px;height:auto}
.cpig-s{position:absolute;font-size:16px;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.syncpill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;max-width:100%}
.syncpill i{width:9px;height:9px;border-radius:50%;flex:none;background:#B9A897}
.syncpill.ok i{background:#7FCB9B}.syncpill.wait i{background:#E9C14F}.syncpill.err i{background:#F28BA8}
.syncpill.busy i{background:#E9C14F;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}
.qstrip{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair)}
.qstrip .chk{height:34px;padding:0 12px 0 8px;font-size:14px}
.brow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.brow:first-child{border-top:0}
.bchk{width:34px;height:34px;flex:none;border-radius:50%;border:2.5px solid var(--edge);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 0 var(--sh);transition:transform .12s}
.bchk:active{transform:translateY(2px);box-shadow:none}
.bchk.on{background:#7FCB9B}.bchk.on svg{width:16px;height:16px}
.bchk.auto{border-style:dashed;box-shadow:none;background:var(--lav2);font-size:14px}
.bchk.lock{border-style:dashed;box-shadow:none;background:var(--cream);opacity:.8;font-size:13px}
.bmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.brow.done .bmain .fr{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.brow.over .bsub{color:var(--neg)}
.bgrp{font-family:Fredoka,sans-serif;font-size:15px;margin:2px 0 -2px;display:flex;align-items:center;gap:8px}
.bgrp b{font-size:12px;background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:0 8px}
.datechip{position:relative;padding:3px 8px 3px 12px;font-size:13px;gap:4px;cursor:pointer;background:var(--fn)}
.datechip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.arrange{min-width:40px;height:34px;border-radius:12px;border:2px solid var(--edge);background:var(--fn);box-shadow:0 2px 0 var(--sh);display:flex;align-items:center;justify-content:center;font-family:Fredoka,sans-serif;font-weight:500;font-size:14px;padding:0 10px;cursor:pointer}
.arrange.on{background:var(--butter)}
.navedit{animation:none!important;border:1px solid var(--hair);margin-bottom:4px;cursor:default}
.navedit .mv{display:flex;align-items:center;justify-content:center;color:var(--ink);width:34px;height:32px;border-radius:10px;border:2px solid var(--edge);background:var(--fn);font-size:12px;cursor:pointer;flex:none}
.navedit .mv:disabled{opacity:.3}
#xc_spw.missing{outline:2px dashed var(--neg);outline-offset:4px;border-radius:12px}
.bgrp svg{flex:none}
.vtag{text-align:center;font-size:13px;color:var(--soft,#9b7f6c);padding:4px 0 8px;line-height:1.5}.vtag span{font-size:11px;opacity:.85}
.dtile{display:flex;flex-direction:column;min-width:0}
.dtile .dsub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brow.moved .bmain .fr{opacity:.6}
.tagline{flex:1;min-width:0;max-height:44px;overflow:hidden;transition:max-height .25s ease}
.tagline.open{max-height:220px;overflow:auto}
.tagmore{flex:none;width:36px;height:36px;margin-top:2px;border-radius:50%;border:2px solid var(--edge);background:var(--fn);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--sh)}
.tagmore[hidden]{display:none}
.mbody>*{flex-shrink:0}
#modal .mbody .card{max-height:none;animation:none}
#upmbox>.card{border:0;box-shadow:none;padding:0;background:none}
#upmbox>.card:active{transform:none}
kbd{font-family:Fredoka,sans-serif;font-weight:500;font-size:13px;min-width:26px;height:26px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--edge);border-radius:8px;background:var(--fn);box-shadow:0 2px 0 var(--sh)}
.krow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--hair)}.krow:first-child{border-top:0}.krow .kk{display:flex;gap:4px;min-width:86px}
.railadd,.dkeys,.wideonly{display:none}
/* ---------- iPad & laptop: side rail + columns, so more fits on one screen ---------- */
@media (min-width:740px){
  :root{--rail:92px}
  #bnav{display:none}
  .top>.ibtn[data-act=drawer]{display:none}
  #drawer .ov{display:none!important}
  #drawer .pane{transform:none!important;width:var(--rail);box-shadow:none;transition:none;padding:calc(14px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom))}
  #drawer .navi{animation:none!important}
  #app{max-width:none;margin:0 0 0 var(--rail);padding:calc(10px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));display:block;column-width:330px;column-gap:18px}
  #app>*{break-inside:avoid;margin:0 0 18px}
  #app>.top,#app>.backrow,#app>.hello,#app>.seg.full,#app>.spanall{column-span:all}
  #app>.ttl{display:none}
  #app>.top{position:relative;top:auto;background:none;max-width:560px;margin-left:auto;margin-right:auto}
  #app>.backrow{margin:-8px 0 14px}
  .railadd{display:flex;width:100%;justify-content:center;gap:4px;margin:2px 0 8px}
  .wideonly{display:block}.mobonly{display:none!important}
  #toast{left:calc(50% + var(--rail) / 2)}
  #modal .card{max-width:440px}
  .navi{justify-content:center;padding:6px}
  .navi .col,.dhead .col,.darr,.dfoot,.railadd .rl{display:none}
  .dhead{justify-content:center;padding:4px 0 8px!important}
}
@media (min-width:1100px){
  :root{--rail:268px}
  .navi{justify-content:flex-start;padding:4px 10px}
  .navi .col,.dhead .col{display:flex}
  .darr,.dfoot{display:flex}
  .railadd .rl{display:inline}
  .dkeys{display:inline-flex}
  .dhead{justify-content:flex-start;padding:4px 6px 10px!important}
}
:root{--okbg:#E4F4E9;--peachbg:#FDEFD9;--dangerbg:#FFE3E3;--warmbg:#FFF0E0;--white:#fff;--edge:#5C3D2E;--sh:#5C3D2E;--paper:#FFFDF8;--ovl:rgba(92,61,46,.26)}

/* =========================================================
   v18: calmer, app-like look (overrides the older rules above)
   ========================================================= */
:root{--line2:#E8D8C6;--hair:#F0E4D6;--tabh:58px;--sheetbg:rgba(60,38,28,.38)}
:root[data-theme="dark"]{--line2:#3F342D;--hair:#342B25;--sheetbg:rgba(0,0,0,.55)}
:root[data-theme="soft"]{--line2:#54493F;--hair:#4A4039;--sheetbg:rgba(20,16,14,.5)}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
*{-webkit-tap-highlight-color:transparent}
button,a,[role=button],.card.tap{touch-action:manipulation;-webkit-touch-callout:none}
button{-webkit-user-select:none;user-select:none}
.inp,.sel,.plain,.note{font-size:16px}
#app{padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--tabh) + 30px + env(safe-area-inset-bottom));gap:18px}
/* cards: thin soft border, no drop shadow. the stitched hero keeps its outline */
.card{border:1.5px solid var(--line2);box-shadow:none;border-radius:22px}
.card.stitch{border-color:var(--edge)}
.card:active,.calwrap .card:active,#modal .card:active{transform:none;box-shadow:none}
.card.tap:active{transform:scale(.985)}
.big{font-size:36px}
/* buttons: only the main yellow button keeps its 3D edge */
.btn.soft{border:1.5px solid var(--line2);box-shadow:none;background:var(--card)}
.btn.soft:not(:disabled):active{transform:scale(.98)!important;box-shadow:none!important}
.ibtn{width:42px;height:42px;border-radius:21px;border:1.5px solid var(--line2);box-shadow:none;background:var(--card)}
.ibtn:active{transform:scale(.92)!important;box-shadow:none!important}
.ibtn svg{max-width:21px;max-height:21px}
.arrow{border:1.5px solid var(--line2);box-shadow:none;background:var(--card);border-radius:12px}
.arrow:not(:disabled):active{transform:scale(.92)!important;box-shadow:none!important}
.tog,.sortbtn,.qchip,.arrange,.backbtn{border:1.5px solid var(--line2);box-shadow:none}
.tog:active,.sortbtn:active,.qchip:active,.arrange:active,.backbtn:active{transform:scale(.95)!important;box-shadow:none!important}
.qchip.on,.arrange.on{border-color:var(--edge)}
.chk{border:1.5px solid var(--line2);box-shadow:none}
.chk.on{border-color:var(--good)}
.chk:active{transform:scale(.95)!important;box-shadow:none!important}
.chip{border:1.5px solid var(--line2)}
.warn{border:1.5px solid #F2C6D2}
:root[data-theme="dark"] .warn,:root[data-theme="soft"] .warn{border-color:var(--line2)}
.bchk{box-shadow:none;border-width:2px}
/* iPhone-style segmented control */
.seg{border:0;box-shadow:none;background:var(--fn);border-radius:14px;padding:3px;gap:3px;overflow:visible}
.seg button{background:transparent;border-radius:11px;height:34px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:14px;color:var(--soft);padding:0 12px}
.seg button+button{border-left:0}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(92,61,46,.2)}
.seg button:active{transform:none!important;box-shadow:none!important}
.seg.full{margin-top:0}
/* header: big page title, back link only on pages you tapped into */
.top{display:none}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px 0;min-height:44px}
.hdr .ht{display:flex;flex-direction:column;gap:1px;min-width:0}
.hdr h1{margin:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:31px;line-height:1.12;letter-spacing:-.3px;overflow-wrap:anywhere}
.hdr.sub h1{font-size:27px}
.hdr .pre{font-size:14px;color:var(--soft);font-weight:700;display:flex;align-items:center;gap:7px}
.hdr .acts{display:flex;gap:8px;flex:none;align-items:center}
.hpill{height:40px;border-radius:20px;border:1.5px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px;color:var(--ink)}
.hpill:active{transform:scale(.95)}
.navrow{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 -14px;min-height:40px}
.backlink{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:8px 10px 8px 0;font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px;color:var(--ink);max-width:70%}
.backlink svg{flex:none}
.backlink:active{opacity:.55}
.sdot{width:9px;height:9px;border-radius:50%;background:#B9A897;border:0;padding:0;flex:none;cursor:pointer}
.sdot.ok{background:#7FCB9B}.sdot.wait{background:#E9C14F}.sdot.err{background:#F28BA8}.sdot.busy{background:#E9C14F;animation:pulse 1s ease-in-out infinite}
/* grouped lists (like iPhone Settings) */
.gsec{display:flex;flex-direction:column;gap:8px}
.gh{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;margin:2px 4px 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gh .gl{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--soft);border:0;background:none;padding:4px 0;white-space:nowrap}
.gh .gv{font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px}
.glbl{font-size:12px;color:var(--soft);font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin:4px 6px 0}
.glist{background:var(--card);border:1.5px solid var(--line2);border-radius:20px;overflow:hidden}
.gi{display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 16px;width:100%;border:0;border-top:1px solid var(--hair);background:var(--card);text-align:left;font:inherit;color:inherit}
.glist>.gi:first-child,.glist>.swr:first-child>.gi{border-top:0}
.glist>.swr+.swr>.gi{border-top:1px solid var(--hair)}
button.gi:active,a.gi:active,.gi[data-act]:active{background:var(--fn)}
.gi .gic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:var(--ink)}
.gi .gic svg{max-width:22px;max-height:22px}
.gi .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gi .gt b{font-family:'Fredoka',sans-serif;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .gt small{font-size:12.5px;color:var(--soft);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .gt small.wrap{white-space:normal}
.gi .gv{font-family:'Fredoka',sans-serif;font-weight:500;font-size:16px;white-space:nowrap;text-align:right}
.gi .gv small{display:block;font-family:'Nunito',sans-serif;font-size:11.5px;color:var(--soft);font-weight:700}
.gi .gch{color:var(--soft);display:flex;flex:none}
.gi.danger .gt b{color:var(--neg)}
.gi.stack{flex-wrap:wrap;row-gap:8px}
.gi .full{flex-basis:100%}
.gdot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--edge);flex:none}
/* swipe left on an expense to delete it */
.swr{position:relative;overflow:hidden}
.swr>.gi{position:relative;z-index:1;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.swr.open>.gi{transform:translateX(-92px)}
.swr.drag>.gi{transition:none}
.swdel{position:absolute;right:0;top:0;bottom:0;width:92px;border:0;background:#E46A80;color:#fff;font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px;padding:0}
/* thin progress bars */
.pbar{height:8px;border-radius:5px;background:var(--fn);overflow:hidden;display:flex}
.pbar i{display:block;height:100%;border-radius:5px}
.pbar.big{height:11px;border-radius:6px}
/* the bottom tab bar sits flat on the bottom edge */
#bnav{position:fixed;left:0;right:0;bottom:0;transform:none;width:auto;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding:5px 6px env(safe-area-inset-bottom);z-index:15;background:var(--card);border:0;border-top:1px solid var(--line2);border-radius:0;box-shadow:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start}
#bnav button{font-family:'Fredoka',sans-serif;font-weight:500;font-size:11px;color:var(--soft);gap:2px;padding:2px 0}
#bnav button .bi{width:54px;height:30px;border-radius:15px;color:inherit}
#bnav button .bi svg{max-width:24px;max-height:24px}
#bnav button.on{color:var(--ink)}
#bnav button.on .bi{background:var(--butter2)}
#bnav .plus{width:48px;height:48px;margin:0 auto;border:2px solid var(--edge);box-shadow:none;font-size:0;background:var(--butter)}
#bnav .plus:active{transform:scale(.92);box-shadow:none}
#toast{bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom))!important}
/* page transitions */
@keyframes pgR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pgL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pgF{from{opacity:0}to{opacity:1}}
#app.pg-r{animation:pgR .3s cubic-bezier(.2,.8,.3,1)}
#app.pg-l{animation:pgL .3s cubic-bezier(.2,.8,.3,1)}
#app.pg-f{animation:pgF .22s ease}
@media (prefers-reduced-motion:reduce){#app.pg-r,#app.pg-l,#app.pg-f{animation:none}}
/* popups: a sheet that slides up from the bottom on phones */
.grab{flex:none;display:none;justify-content:center;padding:8px 0 0;touch-action:none;cursor:grab}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line2)}
#modal .card{border:0;padding:6px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mhead .fr{font-size:20px}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:var(--from,none)}to{transform:translateY(105%)}}
@media (max-width:739px){
  #modal{align-items:flex-end;padding:0;background:var(--sheetbg)!important}
  #modal .card{max-width:none;width:100%;border-radius:26px 26px 0 0;max-height:calc(100dvh - 40px - env(safe-area-inset-top));padding:0 0 env(safe-area-inset-bottom);animation:sheetUp .36s cubic-bezier(.2,.9,.25,1);box-shadow:0 -6px 30px rgba(60,38,28,.18)}
  #modal.closing .card{animation:sheetDown .24s cubic-bezier(.4,0,.8,.4) forwards}
  #modal .card.nudge{animation:nudge .3s ease}
  #modal .grab{display:flex}
  .mbody{padding:10px 18px 14px}
  .mfoot{margin:0 -18px -14px;padding:10px 18px 12px;border-radius:0;bottom:-14px;box-shadow:0 -1px 0 var(--hair)}
  .calwrap{align-items:flex-end;padding:0;background:var(--sheetbg)}
  .calwrap .card{border-radius:26px 26px 0 0;max-width:none;border:0;padding-bottom:calc(18px + env(safe-area-inset-bottom));animation:sheetUp .34s cubic-bezier(.2,.9,.25,1)}
  .calwrap.closing .card{animation:sheetDown .2s ease forwards}
  #disc .card{border:0}
}

/* add expense: big amount + a cute number pad, so the phone keyboard never pops up */

.mtile .pbar{height:6px;background:rgba(255,253,248,.85)}
:root[data-theme="dark"] .mtile .pbar,:root[data-theme="soft"] .mtile .pbar{background:rgba(0,0,0,.25)}
/* activity: week strip */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{border:0;background:transparent;border-radius:15px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font:inherit}
.wday small{font-size:11px;font-weight:800;color:var(--soft)}
.wday b{font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px}
.wday i{width:5px;height:5px;border-radius:50%;background:transparent}

.wday.on{background:var(--butter)}
.wday.on small{color:var(--ink)}
.wday.today:not(.on) b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.wday.fut{opacity:.55}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wnav .mlbl{border:0;background:none;display:inline-flex;align-items:center;gap:6px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:16px;color:var(--ink);padding:6px 4px}
.wnav .arrow{width:34px;height:34px}
/* hero numbers */
.hero{display:flex;flex-direction:column;gap:12px}
.hero .hl{font-size:14px;font-weight:800;opacity:.8}
.hero .hv{font-family:'Fredoka',sans-serif;font-weight:600;font-size:40px;line-height:1.05;letter-spacing:-.5px}
.hero .hs{font-size:13.5px;font-weight:700;opacity:.8}
.empty2{text-align:center;padding:22px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
/* on/off switch */
.sw2{width:51px;height:31px;border-radius:16px;border:0;background:var(--line2);position:relative;flex:none;padding:0;transition:background .2s}
.sw2::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.sw2.on{background:#7FCB9B}
.sw2.on::after{transform:translateX(20px)}
.themepick .sw{border:1.5px solid var(--line2)}
.setrow>.sub{width:96px}
/* iPad & laptop */
@media (min-width:740px){
  #app{padding:calc(14px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
  #app>.hdr,#app>.navrow,#app>.actseg,#app>.spanall{column-span:all}
  #app>.hdr{max-width:none}
  #app>.navrow{margin:-6px 0 0}
  #modal .card{max-width:460px;border-radius:26px}
}

<script>
(function(){
'use strict';
const SWATCHES=['#F28BA8','#7FBFE0','#E9C14F','#B49AE6','#7FCB9B','#F4A86B','#9AA6E8','#C9A27E','#E99AC6','#6FC2B6'];
const PIGC={pink:['#F9C6D3','#F28BA8'],butter:['#FBE7A6','#E9C14F'],mint:['#CDEBD6','#7FCB9B'],blue:['#CFE6F2','#7FBFE0'],lav:['#E3D8F5','#B49AE6'],peach:['#FDD9C0','#F4A86B']};
const CURS={PHP:['₱',2],USD:['$',2],EUR:['€',2],GBP:['£',2],JPY:['¥',0],KRW:['₩',0],SGD:['S$',2],HKD:['HK$',2],AUD:['A$',2],CAD:['C$',2],TWD:['NT$',0],THB:['฿',2],MYR:['RM',2],IDR:['Rp',0],VND:['₫',0],INR:['₹',2],CNY:['CN¥',2],AED:['AED ',2]};
const NOCAT={name:'No category',color:'#E3CDB8'};
const NOPAY={name:'No payment method',color:'#E3CDB8',type:'cash'};
const INK='#5C3D2E';
const TYPES=['cash','ewallet','credit'],TLABEL={cash:'CASH',ewallet:'E-WALLET',credit:'CREDIT'};

/* ---------- state ---------- */
const KEY='moneylog-v1';
function defaults(){
  const cats=['Food','Transpo','Groceries','Bills','Coffee','Shopping','Health','Fun','Others']
    .map((n,i)=>({id:'c'+(i+1),name:n,color:SWATCHES[i%SWATCHES.length]}));
  const pays=[{id:'p1',name:'Cash',color:'#7FCB9B',type:'cash'},{id:'p2',name:'GCash',color:'#7FBFE0',type:'ewallet'},{id:'p3',name:'BPI Credit Card',color:'#F28BA8',type:'credit',cutA:null,dueA:null}];
  return {v:5,cats,pays,entries:[],income:[],moves:[],pigs:[{id:'g1',name:'Savings',color:'pink',goal:null}],utang:[],recs:[],trash:[],budgets:{},challenges:[],calcHist:[],bills:[],inst:[],plan:null,navOrder:[],navBar:null,toolCfg:null,ccMode:false,ccDefault:'',title:'Money Log',
    name:'',weekSun:false,cur:'PHP',lock:{hash:null,len:4,bio:null},sortCat:'desc',sortPay:'desc',sel:null,lastBackup:null};
}
function merge(d,o){
  if(!o||typeof o!=='object'||Array.isArray(o))return d;
  for(const k in d){if(!(k in o))continue;
    if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])&&Object.keys(d[k]).length)d[k]=merge(d[k],o[k]);else if(o[k]!==undefined&&o[k]!==null)d[k]=o[k];}
  return d;
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const num=v=>{if(v===''||v==null)return 0;const n=Number(v);return isFinite(n)?n:0;};
const curInfo=()=>CURS[S.cur]||CURS.PHP;
const CS=()=>curInfo()[0];
const peso=n=>{const [s,d0]=curInfo();n=num(n);const d=Math.abs(n-Math.round(n))<0.005?0:d0;return (n<0?'−':'')+s+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});};
const pesoShort=n=>{const s=n<0?'−':'',c=CS();n=Math.abs(n);return s+(n>=1e6?c+(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1000?c+(n/1000).toFixed(1).replace(/\.0$/,'')+'k':c+Math.round(n));};
const decimal=v=>{v=v.replace(/,/g,'').replace(/[^\d.]/g,'');const i=v.indexOf('.');if(i<0)return v;return v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'').slice(0,2);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ymd=(y,m,d)=>y+'-'+pad2(m)+'-'+pad2(d);
const toYMD=dt=>ymd(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return toYMD(d);};
const today=()=>toYMD(new Date());
const dim=(y,m)=>new Date(y,m,0).getDate();
const addMonth=(y,m,n)=>{m+=n;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return [y,m];};
const monthShift=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const [a,b]=addMonth(y,m,n);return a+'-'+pad2(b);};
const addMonthsDate=(s,k)=>{const [y,m,d]=s.split('-').map(Number);const [a,b]=addMonth(y,m,k);return ymd(a,b,Math.min(d,dim(a,b)));};
const monthIdx=s=>{const [y,m]=s.split('-').map(Number);return y*12+m;};
const weekStart=s=>{const d=parse(s);return shift(s,-(S.weekSun?d.getDay():(d.getDay()+6)%7));};
const niceDay=s=>{const d=parse(s);return WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];};
const shortDay=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()];};
const slashDay=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();};
const clock=ts=>{const d=new Date(ts);let h=d.getHours();const ap=h<12?'am':'pm';h=h%12||12;return h+':'+pad2(d.getMinutes())+' '+ap;};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const catOf=id=>S.cats.find(c=>c.id===id);
const payOf=id=>S.pays.find(p=>p.id===id);
const pigOf=id=>S.pigs.find(p=>p.id===id);
const catInfo=id=>catOf(id)||NOCAT;
const payInfo=id=>payOf(id)||NOPAY;
const activeCats=()=>S.cats.filter(c=>!c.gone);
const activePays=()=>S.pays.filter(p=>!p.gone);
const creditCards=()=>S.pays.filter(p=>p.type==='credit'&&!p.gone).sort((a,b)=>(a.ord==null?99:a.ord)-(b.ord==null?99:b.ord));
const sumWhere=f=>S.entries.reduce((a,e)=>a+(f(e)?num(e.amt):0),0);
const sum=(arr,f)=>arr.reduce((a,x)=>a+(!f||f(x)?num(x.amt):0),0);
const dayTotal=s=>sumWhere(e=>e.date===s);
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function hashStr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}

let S,RAW=null;
try{RAW=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){RAW=null;}
S=merge(defaults(),RAW);
fixup(RAW);
function fixup(raw){
  S.pays.forEach((p,i)=>{
    if(!p.color)p.color=SWATCHES[(i*3+1)%SWATCHES.length];
    if(!p.type)p.type=p.credit?'credit':/gcash|maya|paymaya|grab|shopee|bank|debit|wallet|bdo|bpi|unionbank|metrobank|seabank|gotyme|maribank/i.test(p.name)&&!/credit/i.test(p.name)?'ewallet':'cash';
    if(p.cut&&!p.cutA){const t=today();let [y,m]=t.split('-').map(Number);let end=ymd(y,m,Math.min(p.cut,dim(y,m)));
      if(t>end){[y,m]=addMonth(y,m,1);end=ymd(y,m,Math.min(p.cut,dim(y,m)));}p.cutA=end;
      if(p.due){const [dy,dm]=p.due>p.cut?[y,m]:addMonth(y,m,1);p.dueA=ymd(dy,dm,Math.min(p.due,dim(dy,dm)));}}
    if(p.type==='credit'){if(p.cutA===undefined)p.cutA=null;if(p.dueA===undefined)p.dueA=null;}
    delete p.credit;delete p.cut;delete p.due;delete p.paid;
  });
  if(!S.pigs.length)S.pigs=[{id:'g1',name:'Savings',color:'pink',goal:null}];
  const fw=(S.pays.find(p=>p.type!=='credit')||{}).id;
  S.income.forEach(i=>{if(!i.to)i.to='w:'+fw;delete i.saved;});
  if(raw&&Array.isArray(raw.piggy))raw.piggy.forEach(p=>{const a=Math.abs(num(p.amt));
    S.moves.push({id:p.id,date:p.date,amt:a,from:p.amt>0?'w:'+fw:'pig:'+S.pigs[0].id,to:p.amt>0?'pig:'+S.pigs[0].id:'w:'+fw,note:p.note||'',link:p.from||null,ts:p.ts||0});});
  if(raw&&Array.isArray(raw.cardPays))raw.cardPays.forEach(c=>S.moves.push({id:c.id,date:c.date,amt:num(c.amt),from:'w:'+fw,to:'card:'+c.card,stmt:c.stmt,note:'',ts:0}));
  if(raw&&(raw.piggy||raw.cardPays)){S.v=5;save();}
}
function save(){BALC=null;CYC=null;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(typeof afterSave==='function')afterSave();}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

/* ---------- money logic ---------- */
const walletsAll=()=>S.pays.filter(p=>p.type!=='credit'&&(!p.gone||Math.abs(balOf('w:'+p.id))>.004));
const activeWallets=()=>S.pays.filter(p=>p.type!=='credit'&&!p.gone);
let BALC=null;
function wbal(){
  if(BALC)return BALC;
  const ev={},add=(ref,d,v)=>{if(!ref||ref.slice(0,2)!=='w:'||!v)return;const o=ev[ref]||(ev[ref]={});o[d||'']=(o[d||'']||0)+v;};
  S.income.forEach(i=>add(i.to,i.date,num(i.amt)));
  S.entries.forEach(e=>{if(e.pay)add('w:'+e.pay,e.date,-num(e.amt));});
  S.moves.forEach(m=>{add(m.to,m.date,num(m.amt));add(m.from,m.date,-num(m.amt));});
  S.utang.forEach(u=>{const L=u.dir==='lent';add(u.wallet,u.date,L?-num(u.amt):num(u.amt));(u.pays||[]).forEach(p=>add(p.wallet,p.date||u.date,L?num(p.amt):-num(p.amt)));});
  BALC={};Object.keys(ev).forEach(ref=>{let b=0;Object.keys(ev[ref]).sort().forEach(d=>{b=Math.max(0,Math.round((b+ev[ref][d])*100)/100);});BALC[ref]=b;});
  return BALC;
}
function balOf(ref){
  if(ref&&ref.slice(0,2)==='w:')return wbal()[ref]||0;
  let b=sum(S.income,i=>i.to===ref);
  if(ref.startsWith('w:')){const id=ref.slice(2);b-=sumWhere(e=>e.pay===id);}
  S.moves.forEach(m=>{if(m.to===ref)b+=num(m.amt);if(m.from===ref)b-=num(m.amt);});
  S.utang.forEach(u=>{const L=u.dir==='lent';if(u.wallet===ref)b+=L?-num(u.amt):num(u.amt);(u.pays||[]).forEach(p=>{if(p.wallet===ref)b+=L?num(p.amt):-num(p.amt);});});
  return b;
}
function budOf(id){const b=S.budgets[id];if(!b)return null;if(typeof b==='number')return b>0?{amt:b,per:'month'}:null;return num(b.amt)>0?{amt:num(b.amt),per:b.per==='week'?'week':'month'}:null;}
function budRange(per){const t=today();if(per==='week'){const ws=weekStart(t);return [ws,shift(ws,6)];}const m=t.slice(0,7);return [m+'-01',m+'-31'];}
function budSpent(id,per){const [a,b]=budRange(per);return sumWhere(e=>e.cat===id&&e.date>=a&&e.date<=b);}
const perLbl=p=>p==='week'?'this week':'this month';
const normTag=t=>String(t||'').toLowerCase().replace(/^#+/,'').replace(/\s+/g,' ').trim().slice(0,24);
const pigHasIn=id=>S.moves.some(m=>m.to==='pig:'+id)||S.income.some(i=>i.to==='pig:'+id);
const utPaid=u=>sum(u.pays||[]),utLeft=u=>num(u.amt)-utPaid(u);
const avColor=s=>SWATCHES[hashStr(s||'?')%SWATCHES.length];
const kShort=v=>v>=1e6?(v/1e6).toFixed(1).replace(/\.0$/,'')+'M':v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(v));
function cardEvents(a,b){
  const out=[];
  creditCards().forEach(c=>{if(!c.cutA)return;
    for(let k=monthIdx(a)-monthIdx(c.cutA)-2;k<=monthIdx(b)-monthIdx(c.cutA)+1;k++){
      const cy=cycleK(c,k),end=cy.end;
      if(end>=a&&end<=b)out.push({date:end,type:'cut',card:c,label:c.name+' eSOA',color:c.color,key:cy.key});
      if(cy.due&&cy.due>=a&&cy.due<=b){const amt=cyAmt(c,cy),paid=sum(cyPays(c,cy));
        out.push({date:cy.due,type:'due',card:c,label:c.name+' due',amt,paid,full:amt>0&&paid>=amt-.005,open:end>=today(),color:c.color,key:cy.key,cut:end});}
    }});
  return out;
}
function eventsBetween(a,b,cid){
  let ev=cardEvents(a,b);if(cid)ev=ev.filter(e=>e.card&&e.card.id===cid);
  const t0=today();S.recs.forEach(r=>{if(cid&&r.pay!==cid)return;const seen=new Set();S.entries.forEach(e=>{if(e.rec===r.id&&e.date>=a&&e.date<=b&&e.date<t0){seen.add(e.date);ev.push({date:e.date,type:'rec',rec:r,label:r.name,amt:num(e.amt),color:r.color||'#B49AE6',done:true});}});recBetween(r,a,b).forEach(d=>{if(!seen.has(d)&&(d>=t0||d>=r.start))ev.push({date:d,type:'rec',rec:r,label:r.name,amt:num(r.amt),color:r.color||'#B49AE6'});});});
  return ev.sort((x,y)=>x.date.localeCompare(y.date)||(x.type==='due'?-1:0));
}
let upMonth=null;
let upF='all';
const upKeep=e=>upF==='all'||(upF==='rec'?e.type==='rec':e.type!=='rec');
function upCal(withSummary,cid){
  const t=today();if(!upMonth)upMonth=t.slice(0,7);
  const [y,m]=upMonth.split('-').map(Number),n=dim(y,m),first=S.weekSun?new Date(y,m-1,1).getDay():(new Date(y,m-1,1).getDay()+6)%7;
  const ev=eventsBetween(upMonth+'-01',ymd(y,m,n),cid).filter(upKeep),by={};ev.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  let cells=(S.weekSun?'SMTWTFS':'MTWTFSS').split('').map(d=>'<span class="wd fr">'+d+'</span>').join('')+'<span></span>'.repeat(first);
  for(let d=1;d<=n;d++){const s=ymd(y,m,d),es=by[s]||[];
    const mk=es.slice(0,4).map(e=>e.type==='rec'?'<i class="mk" style="background:'+e.color+'"></i>':e.type==='cut'?'<i class="mk cut"></i>':'<i class="mk due"></i>').join('');
    cells+='<button type="button" class="uday fr'+(s===t?' today':'')+(s<t?' past':'')+(es.length?' has':'')+'" data-act="'+(es.length?'upday':'pick')+'" data-d="'+s+'" aria-label="'+d+' '+MONL[m-1]+(es.length?', '+es.map(e=>e.label).join(', '):'')+'">'+d+'<span class="marks">'+mk+'</span></button>';}
  const sum1=withSummary===false?'':upMonthList(cid);
  return '<div class="card">'+navArrows('upm',false,'<div class="col" style="align-items:center"><span class="ttl">'+(cid?'Upcoming for this card':'Upcoming payments')+'</span><span class="sub">'+MONL[m-1]+' '+y+'</span></div>')+
    '<div class="ucal">'+cells+'</div>'+
    '<div class="legend"><span><i class="mk" style="background:#B49AE6"></i>repeating</span><span><i class="mk cut"></i>eSOA posts</span><span><i class="mk due"></i>card due</span></div>'+
    (sum1?'<div style="margin-top:10px;border-top:1px solid var(--hair);padding-top:8px"><div class="qchips">'+[['all','Everything'],['rec','Repeating'],['card','Card dates']].map(([k,l])=>'<button type="button" class="qchip'+(upF===k?' on':'')+'" data-act="upf" data-v="'+k+'">'+l+'</button>').join('')+'</div>'+sum1+'</div>':'')+'</div>';
}
function upListCard(cid){return '<div class="card"><div class="ttl">Coming up</div><div class="qchips" style="margin-top:8px">'+[['all','Everything'],['rec','Repeating'],['card','Card dates']].map(([k,l])=>'<button type="button" class="qchip'+(upF===k?' on':'')+'" data-act="upf" data-v="'+k+'">'+l+'</button>').join('')+'</div>'+upMonthList(cid)+'</div>';}
function upDayModal(d){
  const ev=eventsBetween(d,d,null).filter(upKeep),sp=S.entries.filter(e=>e.date===d&&num(e.amt)>0),tot=sp.reduce((a,e)=>a+num(e.amt),0),t=today();
  const row=e=>{const dot=e.type==='rec'?'<i class="mk" style="background:'+e.color+';flex:none"></i>':e.type==='cut'?'<i class="mk cut" style="flex:none"></i>':'<i class="mk due" style="flex:none"></i>';
    const nm=e.type==='rec'?esc(e.label):e.type==='cut'?esc(e.card.name)+' · '+MON[+(e.key||d).slice(5,7)-1]+' eSOA posts':esc(e.card.name)+' · '+MON[+(e.key||d).slice(5,7)-1]+' eSOA due';
    const st=e.type==='rec'?(e.done||d<t?'logged ✓':d===t?'logs today':'will log itself'):e.type==='due'?(e.full?'paid ✓':e.open?'still adding up':d<t?'not paid':'to pay'):'';
    const amt=e.type==='due'?(e.full?e.amt:Math.max(0,e.amt-e.paid)):e.amt;
    return '<div class="leg" style="padding:8px 0;font-size:14px;align-items:center;border-top:1px solid var(--hair)">'+dot+'<span class="col" style="flex:1;min-width:0;gap:0"><span class="nm" style="font-weight:700">'+nm+'</span>'+(st?'<span class="sub" style="font-size:12px">'+st+'</span>':'')+'</span><span class="fr" style="font-weight:500">'+(amt>0&&e.type!=='cut'?peso(amt):'')+'</span></div>';};
  openModal('<div class="col" style="gap:2px"><span class="cute" style="font-size:22px">'+(d===t?'today':niceDay(d))+'</span><span class="sub">'+(ev.length?ev.length+' thing'+(ev.length>1?'s':'')+' on this day':'nothing scheduled')+'</span></div>'+

function keyNav(e){
  if(e.metaKey||e.ctrlKey||e.altKey||isTyping())return false;
  if(!$('#modal').hidden||!$('#lock').hidden||!$('#auth').hidden||calOpen)return false;
  const k=e.key.length===1?e.key.toLowerCase():e.key,pg=curPage();
  const go=p=>{e.preventDefault();goPage(p);return true;};
  if(/^[1-9]$/.test(k)){const q=navPages()[+k-1];return q?go(q.id):false;}
  if(k==='n'||k==='a'){e.preventDefault();expModal(null,today());return true;}
  if(k==='t'){e.preventDefault();S.sel=today();save();goPage('day');return true;}
  if(k===','){return go('settings');}
  if(k==='/'){e.preventDefault();goPage('search');setTimeout(()=>{const el=document.querySelector('[data-in=sq]');if(el)el.focus();},80);return true;}
  if(k==='?'){e.preventDefault();keysModal();return true;}
  const step=k==='ArrowLeft'||k==='['?-1:k==='ArrowRight'||k===']'?1:0;
  if(step){if(pg==='day'){e.preventDefault();handleAct({dataset:{act:'day',v:String(step)}});return true;}
    if(pg==='home'){e.preventDefault();handleAct({dataset:{act:'dw',v:String(step)}});return true;}

    return false;}

}

  let rows='<div class="gi stack"><span class="gt"><b style="font-size:24px;font-weight:600;white-space:normal">'+peso(tot)+' <span style="font-family:Nunito,sans-serif;font-size:14px;font-weight:700;color:var(--soft)">spent in '+MONL[+ym.slice(5)-1]+'</span></b>'+(plan?'':'<small class="wrap">no monthly plan yet. tap <b>set a plan</b> to keep an eye on it</small>')+'</span>'+
    (plan?'<span class="full">'+planBarHtml(tot,plan,true)+'</span><small class="full" style="font-size:12.5px;color:var(--soft);font-weight:700">'+planText(tot,plan)+'</small>':'')+'</div>';
  cs.forEach(c=>{const v=monSpent(ym,e=>e.pay===c.id),cp=num(c.plan);
    rows+='<button type="button" class="gi stack" data-act="opencard" data-id="'+c.id+'"><span class="gdot" style="background:'+c.color+'"></span><span class="gt"><b>'+esc(c.name)+'</b></span><span class="gv">'+peso(v)+(cp?'<small>of '+esc(pesoShort(cp))+'</small>':'')+'</span>'+(cp?'<span class="full">'+planBarHtml(v,cp)+'</span>':'')+'</button>';});

  return gsec('This Month',glist(rows),'<button type="button" class="gl" data-act="plan">'+(plan||cs.some(c=>c.plan)?'edit plan':'set a plan')+'</button>');
}

function dayBarsMonth(ym){
  const t=today(),[y,m]=ym.split('-').map(Number),n=dim(y,m),vals=[...Array(n)].map((_,i)=>dayTotal(ymd(y,m,i+1))),max=Math.max(...vals,1);
  const W=330,H=140,base=112,top=12,slot=W/n,bw=Math.max(4,slot*.64);
  let g='';
  vals.forEach((v,i)=>{const d=ymd(y,m,i+1),x=i*slot+(slot-bw)/2,cx=x+bw/2,fut=d>t,isT=d===t,h=v?Math.max(4,(base-top)*v/max):0,dn=i+1;
    g+='<g data-act="pick" data-d="'+d+'" style="cursor:pointer"><rect x="'+(i*slot).toFixed(1)+'" y="0" width="'+slot.toFixed(1)+'" height="'+H+'" fill="transparent"/>';
    if(v)g+='<rect x="'+x.toFixed(1)+'" y="'+(base-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+Math.min(3,bw/2).toFixed(1)+'" fill="'+(isT?'#E9C14F':'#F6B8C8')+'" stroke="'+INK+'" stroke-width="1.4"><title>'+niceDay(d)+': '+peso(v)+'</title></rect>';
    else if(!fut)g+='<circle cx="'+cx.toFixed(1)+'" cy="'+(base-3)+'" r="1.6" fill="#E3CDB8"/>';
    if(isT)g+='<circle cx="'+cx.toFixed(1)+'" cy="'+(base+24)+'" r="2.6" fill="'+INK+'"/>';
    if(dn===1||dn%5===0)g+='<text x="'+cx.toFixed(1)+'" y="'+(base+16)+'" text-anchor="middle" font-family="Fredoka" font-weight="500" font-size="10" fill="'+(fut?'#C9B3A2':INK)+'">'+dn+'</text>';
    g+='</g>';});
  const act=vals.filter(v=>v>0),avg=act.length?act.reduce((a,v)=>a+v,0)/act.length:0;
  let avgL='';if(avg){const yy=(base-(base-top)*avg/max).toFixed(1);avgL='<line x1="2" x2="'+(W-2)+'" y1="'+yy+'" y2="'+yy+'" stroke="#8F6E5C" stroke-width="1.3" stroke-dasharray="4 4" opacity=".7"/><text x="'+(W-2)+'" y="'+(yy-4)+'" text-anchor="end" font-family="Nunito" font-weight="800" font-size="9" fill="#8F6E5C">avg '+kShort(avg)+'/day</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Spending per day">'+g+avgL+'<line x1="2" x2="'+(W-2)+'" y1="'+base+'" y2="'+base+'" stroke="'+INK+'" stroke-width="2" stroke-linecap="round"/></svg>';
}

let flowOpen=false;
function flowCardHtml(){

  const blk=(type,title)=>{
    const set=new Set(S.pays.filter(p=>p.type===type).map(p=>'w:'+p.id)),inM=d=>d&&d.startsWith(fm);
    const inc=sum(S.income,i=>inM(i.date)&&set.has(i.to)),spent=sumWhere(e=>inM(e.date)&&set.has('w:'+e.pay));
    let mIn=0,mOut=0,bills=0;
    S.moves.forEach(m=>{if(!inM(m.date))return;const a=num(m.amt);if(set.has(m.to)&&!set.has(m.from))mIn+=a;if(set.has(m.from)&&!set.has(m.to)){if(m.to.startsWith('card:'))bills+=a;else mOut+=a;}});

    const n=inc-spent+mIn-mOut-bills;net+=n;

  const W=330,H=130,base=104,top=12,slot=W/n,bw=Math.max(3,slot*.62);let g='';

    else if(!fut)g+='<circle cx="'+(x+bw/2).toFixed(1)+'" cy="'+(base-3)+'" r="1.4" style="fill:var(--line)"/>';

/* STREAKS + CHALLENGES */
function streakData(f){
  const t=today(),ents=S.entries.filter(e=>num(e.amt)>0&&!e.rec);
  const first=ents.reduce((a,e)=>!a||e.date<a?e.date:a,null);
  if(!first)return {cur:0,best:0,first:null,spentToday:false};
  const dates=new Set(ents.filter(f).map(e=>e.date));
  let cur=0,d=t;while(d>=first&&!dates.has(d)){cur++;d=shift(d,-1);}
  let best=0,run=0;for(let x=first,g=0;x<=t&&g<4000;x=shift(x,1),g++){if(dates.has(x))run=0;else{run++;if(run>best)best=run;}}
  return {cur,best,first,spentToday:dates.has(t)};
}
function chMatch(c,e){if(c.cat&&e.cat!==c.cat)return false;if(c.tag){const tg=c.tag;if(!((e.tags||[]).includes(tg)||(e.note||'').toLowerCase().includes(tg)))return false;}return true;}
function chStatus(c){
  const t=today(),end=shift(c.start,c.days-1),upto=t<end?t:end;
  if(t<c.start)return {state:'upcoming',end,spent:0,n:0,elapsed:0,clean:0,last:null};
  const m=S.entries.filter(e=>num(e.amt)>0&&e.date>=c.start&&e.date<=upto&&chMatch(c,e));
  const spent=m.reduce((a,e)=>a+num(e.amt),0),last=m.reduce((a,e)=>!a||e.date>a?e.date:a,null);
  const elapsed=Math.min(c.days,daysBetween(c.start,upto)+1),clean=last?daysBetween(last,upto):elapsed;
  let state;if(c.cap)state=spent>c.cap?'failed':t>end?'done':'on';else state=m.length?'slipped':t>end?'done':'on';
  return {state,end,spent,n:m.length,elapsed,clean,last};
}

/* CALCULATOR */
let calc={expr:''},calcRef=false;
function calcSafe(x){x=String(x).replace(/[+\-*/.]+$/,'');if(!x||!/^[0-9+\-*/().\s]+$/.test(x))return NaN;try{const v=Function('"use strict";return ('+x+')')();return isFinite(v)?v:NaN;}catch(_){return NaN;}}
function calcVal(e){e=(e==null?calc.expr:e).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  let out='',last=0,m;const re=/(\d*\.?\d+)%/g;
  while((m=re.exec(e))){const before=out+e.slice(last,m.index),op=before.slice(-1);let rep;
    if(op==='+'||op==='-'){const lv=calcSafe(before.slice(0,-1));rep=isNaN(lv)?'('+m[1]+'/100)':'('+lv+'*'+m[1]+'/100)';}else rep='('+m[1]+'/100)';
    out=before+rep;last=re.lastIndex;}
  return calcSafe(out+e.slice(last));}
const calcFmt=v=>isNaN(v)?'':(Math.round(v*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
function calcUpdate(){const ex=$('#c_ex'),rs=$('#c_res');if(!ex)return;ex.textContent=calc.expr||' ';const v=calcVal();rs.textContent=calc.expr?(isNaN(v)?'…':calcFmt(v)):'0';ex.scrollLeft=ex.scrollWidth;}
function calcKey(k){
  const ops='+−×÷';let e=calc.expr;

/* SEARCH */
const srch={q:'',m:'',cat:'',pay:''};
P.search={
  html(){
    const months=[...new Set(S.entries.filter(e=>num(e.amt)>0).map(e=>e.date.slice(0,7)))].sort().reverse();
    const sel=(id,cur,opts,all)=>'<select class="sel'+(cur?'':' ')+'" style="flex:1;min-width:0" data-in="'+id+'"><option value="">'+all+'</option>'+opts.map(([v,l])=>'<option value="'+v+'"'+(v===cur?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
    return '<div class="card stitch" style="background:var(--blue2)"><span class="cute" style="font-size:22px">find an expense</span>'+
      '<div class="amt" style="margin-top:8px"><span style="font-size:20px">🔍</span><input class="inp" data-in="sq" placeholder="search notes… e.g. grab, jollibee" value="'+esc(srch.q)+'" autocomplete="off" enterkeyhint="search"></div>'+
      '<div class="col g8" style="margin-top:10px">'+
        '<label class="row g8"><span class="lbl" style="width:78px;flex:none">Month</span>'+sel('sm',srch.m,months.map(m=>[m,MONL[+m.slice(5)-1]+' '+m.slice(0,4)]),'all months')+'</label>'+
        '<label class="row g8"><span class="lbl" style="width:78px;flex:none">Spent on</span>'+sel('scat',srch.cat,S.cats.map(c=>[c.id,c.name]).concat([['none','(no category)']]),'everything')+'</label>'+
        '<label class="row g8"><span class="lbl" style="width:78px;flex:none">Paid with</span>'+sel('spay',srch.pay,S.pays.map(p=>[p.id,p.name]).concat([['none','(no payment method)']]),'any method')+'</label></div>'+
      '<button type="button" class="linkbtn" style="margin-top:6px" data-act="sclear">clear filters</button></div>'+
      '<div id="sres" class="col" style="gap:16px"></div>';
  },
  update(){
    const q=srch.q.trim().toLowerCase();
    let r=S.entries.filter(e=>num(e.amt)>0);
    if(srch.m)r=r.filter(e=>e.date.startsWith(srch.m));
    if(srch.cat)r=r.filter(e=>srch.cat==='none'?!catOf(e.cat):e.cat===srch.cat);
    if(srch.pay)r=r.filter(e=>srch.pay==='none'?!payOf(e.pay):e.pay===srch.pay);
    if(q)r=r.filter(e=>(e.note||'').toLowerCase().includes(q)||(e.tags||[]).some(t=>t.includes(q.replace(/^#/,'')))||catInfo(e.cat).name.toLowerCase().includes(q)||payInfo(e.pay).name.toLowerCase().includes(q));
    r.sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
    const total=r.reduce((a,e)=>a+num(e.amt),0),shown=r.slice(0,150);
    const groups=[];shown.forEach(e=>{const g=groups[groups.length-1];if(g&&g.d===e.date)g.l.push(e);else groups.push({d:e.date,l:[e]});});
    const el=$('#sres');if(!el)return;
    el.innerHTML='<div class="card" style="background:var(--butter2);padding:14px 16px"><div class="row sb"><span class="fr">'+r.length+' expense'+(r.length===1?'':'s')+'</span><span class="mid" style="font-size:22px">'+peso(total)+'</span></div></div>'+
      (groups.length?'<div class="card" style="padding:8px 16px 12px">'+groups.map(g=>'<div class="sgroup"><button type="button" class="wrow" style="padding:8px 0 4px" data-act="pick" data-d="'+g.d+'"><span class="fr" style="flex:1">'+niceDay(g.d)+' '+g.d.slice(0,4)+'</span><span class="sub">'+peso(g.l.reduce((a,e)=>a+num(e.amt),0))+'</span><span class="go">'+ICON.chev+'</span></button>'+
        g.l.map(e=>{const c=catInfo(e.cat),p=payInfo(e.pay);return '<div class="tx"><span class="dot" style="width:12px;height:12px;background:'+c.color+'"></span><span class="col" style="flex:1;min-width:0"><span class="ell">'+esc(e.note||c.name)+'</span><span class="sub ell" style="font-size:12px">'+(e.note?esc(c.name)+' · ':'')+esc(p.name)+'</span></span><span class="fr" style="font-weight:500">'+peso(e.amt)+'</span></div>';}).join('')+'</div>').join('')+
        (r.length>150?'<div class="sub" style="text-align:center;font-size:13px;padding-top:8px">showing the newest 150. add a filter to narrow it down.</div>':'')+'</div>'
        :'<div class="empty"><span class="cute" style="font-size:21px">nothing found</span></div>');
  }
};

/* ---------- router ---------- */
let manualPage=null;
function curPage(){const map={year:'sum',month:'sum'};let id='';if(manualPage)id=manualPage;else{try{id=(location.hash||'').slice(1);}catch(e){}}if(!id)id='home';if(map[id])id=map[id];return P[id]?id:'home';}
function render(){
  BALC=null;CYC=null;
  const t=today(),tm=t.slice(0,7);
  if(!S.sel)S.sel=t;
  try{document.title=S.title||'Money Log';}catch(_){}
  if(!viewMonth||viewMonth>tm)viewMonth=tm;
  if(!flowMonth||flowMonth>tm)flowMonth=tm;
